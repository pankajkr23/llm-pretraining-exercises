[project]
name = "exercise-10-training-loop"
version = "0.1.0"
description = "Exercise 10 — The training loop"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "exercise-09-loss-functions-output-heads",
]

[tool.uv.sources]
exercise-09-loss-functions-output-heads = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainloop"]
