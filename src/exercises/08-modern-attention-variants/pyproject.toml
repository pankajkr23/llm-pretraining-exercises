[project]
name = "exercise-08-modern-attention-variants"
version = "0.1.0"
description = "Exercise 08 — modern attention variants, in the order they were launched"
requires-python = ">=3.12"

# The chronology needs numpy and nothing else, and that is still true of every module outside
# `attention/lab/`: its claims are sourced dates and closed-form arithmetic, so CI verifies them
# completely with no extras.
#
# The lab is the exception, added on PK's request (DECISIONS.md D16): runnable implementations of
# every mechanism the catalogue lists, which need torch. It sits behind the same optional `train`
# extra exercises 05, 06 and 07 use, so the chronology stays torch-free.
#
#     uv sync --all-packages --extra train
dependencies = [
    # The lab's language-model task reads the frozen corpus and tokenizer through exercise 09,
    # exactly as exercises 07 and 10 do, rather than keeping a second copy of either.
    "exercise-09-loss-functions-output-heads",
    "numpy>=2",
]

[project.optional-dependencies]
train = [
    "torch>=2.6",
]

[tool.uv.sources]
exercise-09-loss-functions-output-heads = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attention"]
