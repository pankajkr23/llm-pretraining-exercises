<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>How attention works now — the order it was built in</title>
    <meta
      name="description"
      content="Thirty ways of computing attention and of telling a model where a token sits, in the order they were actually launched. Attention charges twice — compute that grows with the square of the context, and a cache that grows with it — and almost everything since 2017 is somebody paying less of one of those two bills. From 2014 to August 2026, every date read from the primary source."
    />
    <!-- Inline so it costs no request; a missing favicon is a 404 in every reader's console. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230071e3'/%3E%3Cg fill='%23fff'%3E%3Crect x='6' y='6' width='6' height='6' rx='1'/%3E%3Crect x='13' y='13' width='6' height='6' rx='1'/%3E%3Crect x='6' y='13' width='6' height='6' rx='1'/%3E%3Crect x='20' y='20' width='6' height='6' rx='1'/%3E%3Crect x='13' y='20' width='6' height='6' rx='1'/%3E%3Crect x='6' y='20' width='6' height='6' rx='1'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/_shared/tokens.css" />
    <link rel="stylesheet" href="./_shared/tokens.css" />
    <link rel="stylesheet" href="./_shared/explainer.css" />
    <link rel="stylesheet" href="./_shared/page.css" />
    <link rel="stylesheet" href="./page-extra.css" />
    <!--
      Applied before first paint, on purpose. Reading the stored theme from a module would leave
      the page rendering system colours for a frame and then repainting, which is the flash every
      theme switcher is judged by.
    -->
    <script>
      try {
        var t = localStorage.getItem('era5-theme');
        if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        /* Private mode or blocked storage: the system theme is a fine answer. */
      }
    </script>
  </head>
  <body>
    <div class="wrap">
      <div class="shellbar">
        <a class="back" href="../"><span aria-hidden="true">←</span> Back</a>
        <div class="themepick">
          <label for="theme">Theme</label>
          <select id="theme">
            <option value="system">System</option>
            <option value="soft-light">Soft light</option>
            <option value="tinted-dark">Tinted dark</option>
            <option value="high-contrast">High contrast</option>
            <option value="neon">Neon</option>
          </select>
        </div>
      </div>
      <aside id="rail" class="rail"></aside>
      <main id="main"></main>
      <footer id="foot"></footer>
    </div>

    <script type="module">
      import { buildPage } from './chapters.js';
      import { bindThemePicker } from './_shared/theme.js';
      import { M } from './data.js';

      buildPage(M);

      /* The picker. The head script already applied the stored choice; this only keeps the control
       * in step with it and writes changes back. "system" removes the attribute rather than setting
       * a value, because that is what lets prefers-color-scheme take over again. */
      bindThemePicker();
    </script>
  </body>
</html>
