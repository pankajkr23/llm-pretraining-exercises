<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attention, one diagram at a time — the field guide</title>
    <meta
      name="description"
      content="Every attention mechanism on one page, each drawn to the same convention so they can be compared. Which query-key pairs survive, how many keys are kept, what a fixed state does with each token, and how position enters."
    />
    <link rel="canonical" href="../" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230071e3'/%3E%3Cg fill='%23fff'%3E%3Crect x='6' y='6' width='6' height='6' rx='1'/%3E%3Crect x='13' y='13' width='6' height='6' rx='1'/%3E%3Crect x='6' y='13' width='6' height='6' rx='1'/%3E%3Crect x='20' y='20' width='6' height='6' rx='1'/%3E%3Crect x='13' y='20' width='6' height='6' rx='1'/%3E%3Crect x='6' y='20' width='6' height='6' rx='1'/%3E%3C/g%3E%3C/svg%3E"
    />
    <!--
      The FIRST link is the one that matters and it is absolute on purpose. `/_shared/tokens.css`
      is the real six-theme token file; `./../_shared/tokens.css` is a vendored component stylesheet
      that only happens to share the name. A page that links the second and not the first renders
      with every token undefined — and `stroke: var(--bg)` on an undefined token paints nothing at
      all, with a clean console. That has cost this exercise real time twice.
    -->
    <link rel="stylesheet" href="/_shared/tokens.css" />
    <link rel="stylesheet" href="../_shared/tokens.css" />
    <link rel="stylesheet" href="../_shared/page.css" />
    <link rel="stylesheet" href="../page-extra.css" />
    <link rel="stylesheet" href="./guide.css" />
    <!-- Applied before first paint, so a chosen theme does not flash the system one first. -->
    <script>
      try {
        var t = localStorage.getItem('era5-theme');
        if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        /* Private mode or blocked storage: the system theme is a fine answer. */
      }
    </script>
  </head>
  <body>
    <div class="wrap guide-wrap">
      <div class="shellbar">
        <a class="back" href="../"><span aria-hidden="true">←</span> Back to the feature</a>
        <div class="themepick">
          <label for="theme">Theme</label>
          <select id="theme">
            <option value="system">System</option>
            <option value="soft-light">Soft light</option>
            <option value="tinted-dark">Tinted dark</option>
            <option value="high-contrast">High contrast</option>
            <option value="neon">Neon</option>
          </select>
        </div>
      </div>

      <header class="fg-head">
        <p class="kicker">The field guide</p>
        <h1 class="fg-title">Every mechanism, one convention</h1>
        <p class="fg-lede" id="fg-lede"></p>
        <div class="fg-key" id="fg-key"></div>
      </header>

      <nav class="fg-filters" id="fg-filters" aria-label="Filter the guide"></nav>
      <p class="fg-count" id="fg-count" role="status"></p>
      <main class="fg-grid" id="fg-grid"></main>

      <footer class="fg-foot">
        <p>
          Drawn from the same catalogue as
          <a href="../">the feature</a>, which carries the chronology, the trade-offs and the
          sources. Every date on both was read from the paper it came from.
        </p>
      </footer>
    </div>

    <script type="module">
      import { buildGuide } from './guide.js';
      import { M } from '../data.js';

      buildGuide(M);

      const picker = document.getElementById('theme');
      const stored = (() => {
        try {
          return localStorage.getItem('era5-theme');
        } catch {
          return null;
        }
      })();
      picker.value = stored || 'system';
      picker.addEventListener('change', () => {
        const v = picker.value;
        if (v === 'system') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', v);
        try {
          localStorage.setItem('era5-theme', v);
        } catch {
          /* nothing to do */
        }
      });
    </script>
  </body>
</html>
