[project]
name = "exercise-07-model-embeddings-internals"
version = "0.1.0"
description = "Exercise 07 — Kronecker byte embeddings v2: an invertible codec and a vocabulary-independent output head"
requires-python = ">=3.12"
dependencies = [
    # The frozen 10k tokenizer is the vocabulary every measurement here is made against — the
    # collision count, the byte-length distribution and the recovery rate are all properties of a
    # specific vocabulary, so it has to be THE one the repo already froze rather than a fresh one.
    "exercise-04-data-cleaning-dedup",
    # The transformer body every trained arm shares. Exercise 09's `build_trunk` returns hidden
    # states and owns no output head, which is exactly the split a comparison of output heads
    # needs, and its `make_tied_head`/`make_untied_head` are two of the arms. This repository
    # already holds three transformer implementations; writing a fourth to avoid one import would
    # be the second copy that drifts. Exercise 10 depends on 09 the same way.
    "exercise-09-loss-functions-output-heads",
    # The corpus. Exercise 06's fetcher is the only one in this repo that records a LICENCE per
    # lane, verified from each dataset's own card at download time, and its corpus is ~23x larger
    # than exercise 02's, which is what lets a 500-step run read 0.02 epochs instead of repeating
    # itself. What is imported is deliberately narrow: `read_documents` and `lanes_from_fetch`, so
    # the JSONL is parsed by the module that learned why it must be JSONL. 06 depends on 04 and 05,
    # so this adds no cycle.
    "exercise-06-build-training-dataset",
    "numpy>=2",
]

# torch is an OPTIONAL extra, for the same reason as exercises 05 and 06 — and the boundary is
# unusually clean here. The codec, the decoder, the collision analysis and the parameter arithmetic
# are pure numpy, and they carry most of the findings. Only the trained comparison of output heads
# needs torch. CI runs `uv sync --all-packages` with no extras, so that split means CI verifies the
# invertibility result — the load-bearing one — rather than skipping it.
#
#     uv sync --all-packages --extra train
[project.optional-dependencies]
train = [
    "torch>=2.6",
]

[tool.uv.sources]
exercise-04-data-cleaning-dedup = { workspace = true }
exercise-06-build-training-dataset = { workspace = true }
exercise-09-loss-functions-output-heads = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embeddings"]
