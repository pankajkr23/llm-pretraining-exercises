[project]
name = "exercise-05-datamixtures-and-curriculum"
version = "0.1.0"
description = "Session 5 — the V5 data mixture and curriculum, sized against real supply"
requires-python = ">=3.12"
dependencies = [
    # The repetition arithmetic lives in `dataframework.mix` with its citation attached
    # (Muennighoff et al., JMLR v26 2025, Eq. 18). Re-deriving it here would mean two copies of a
    # constant that no test compares — and the whole point of this exercise is that a number is
    # only as good as the thing it can be traced to.
    "exercise-03-data-collection-framework",
    # Fertility is measured, never estimated: `datacleaning.tokens` counts with our own Session 2
    # vocabulary and refuses to publish a count that is mostly [UNK]. TOKENIZER.md is built on it.
    "exercise-04-data-cleaning-dedup",
]

[tool.uv.sources]
exercise-03-data-collection-framework = { workspace = true }
exercise-04-data-cleaning-dedup = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mixture"]
