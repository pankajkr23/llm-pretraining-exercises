[project]
name = "exercise-04-data-cleaning-dedup"
version = "0.1.0"
description = "Session 4 — cleaning and deduplicating a pre-training corpus"
requires-python = ">=3.12"
dependencies = [
    # Row-group streaming: a 344 MB shard costs only the row groups we consume.
    "pyarrow>=25.0.0",
    "huggingface-hub>=1.22.0",
    # Token counts are counted, never estimated from a fertility ratio (BRIEF.md §D3).
    # `tokenizers` loads our own Session 2 vocabulary; `tiktoken` covers two of the references.
    "tokenizers>=0.23.1",
    "tiktoken>=0.13.0",
    # MinHash at 112 permutations over ~100k documents is ~1e9 operations in pure Python and
    # seconds vectorised. Load-bearing, not convenience.
    "numpy>=2.0",
    # `dataframework.shingles.normalise()` carries correction X16: Python's \w+ shatters Indic
    # words at every combining mark, which would turn 5-word shingles into consonant fragments and
    # make deduplication silently wrong. Reusing it beats re-finding that bug.
    "exercise-03-data-collection-framework",
]

[tool.uv.sources]
exercise-03-data-collection-framework = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datacleaning"]
