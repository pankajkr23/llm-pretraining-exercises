[project]
name = "exercise-01-introductions"
version = "0.1.0"
description = "Exercise 01 — Introductions: why activations, depth, embeddings, and data matter"
requires-python = ">=3.12"

# The deployed pages in `web/` are hand-written browser JavaScript and need nothing from Python.
# The `foundations` package is the same four ideas as small, seeded torch experiments, so the topic
# notebook can import tested code rather than re-implementing it in cells. torch sits behind the
# same optional `train` extra exercises 05-14 use, so a plain sync stays torch-free:
#
#     uv sync --all-packages --extra train
dependencies = []

[project.optional-dependencies]
train = [
    "torch>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundations"]
