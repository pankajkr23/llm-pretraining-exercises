<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Decision — what to train an Indian language model on</title>
    <meta
      name="description"
      content="The argument end to end: what to train on, in what proportion, at what it costs, and what would prove it wrong."
    />
    <link rel="stylesheet" href="../_shared/tokens.css" />
    <style>
      .wrap { max-width: 820px; }
      section { padding-bottom: 40px; margin-bottom: 40px; border-bottom: 1px solid var(--line); }
      section:last-of-type { border-bottom: 0; }
      section h2 { display: flex; align-items: baseline; gap: 10px; }
      section h2 .n { font-family: var(--mono); font-size: 12px; color: var(--faint); }
      .claim { font-size: 1.02rem; max-width: 66ch; margin: 0 0 18px; }
      .claim b { font-weight: 600; }
      figure { margin: 0; }
      figcaption { font-size: 13px; color: var(--muted); font-style: italic; margin-top: 12px; max-width: 62ch; }
      a.ref { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }

      .widget { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
      .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
      button.seg, .replay {
        font-family: var(--mono); font-size: 12.5px; padding: 6px 13px; border-radius: 8px;
        border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer;
      }
      button.seg[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      .replay { margin-top: 12px; }
      input[type="range"] { accent-color: var(--accent); }

      .bars { display: grid; gap: 7px; }
      .barrow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 96px; gap: 10px; align-items: center; font-size: 13px; }
      .barrow .track { background: var(--track); border-radius: 5px; height: 15px; overflow: hidden; }
      .barrow .fill { height: 100%; background: var(--accent); border-radius: 5px; width: 0; transition: none; }
      .barrow .val { text-align: right; font-family: var(--mono); font-size: 12px; }
      .fill.indic { background: var(--lang-tier-1); }
      .fill.synth { background: var(--gotcha-composition); }
      .fill.gap { background: repeating-linear-gradient(45deg, var(--track), var(--track) 5px, var(--faint) 5px, var(--faint) 6px); }

      .gatebox { font-family: var(--mono); font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; white-space: pre-wrap; line-height: 1.65; }
      .gatebox .fail { color: var(--grade-x); font-weight: 700; }
      .gatebox .pass { color: var(--grade-a); font-weight: 700; }

      .verdictline { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-family: var(--mono); font-size: 13px; margin-top: 12px; }
      .chip { border: 1px solid currentColor; border-radius: 5px; padding: 1px 8px; font-size: 11.5px; font-weight: 700; }
      .chip.win { color: var(--grade-a); } .chip.parity { color: var(--grade-b); } .chip.lose { color: var(--grade-x); }

      .stages { display: grid; gap: 6px; }
      .stage { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; font-size: 13px; opacity: 0.45; }
      .stage.on { opacity: 1; border-color: var(--accent); background: var(--accent-soft); }
      .stage .idx { font-family: var(--mono); font-size: 11px; color: var(--faint); }

      .weeks { position: relative; display: grid; gap: 5px; }
      .task { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 12.5px; }
      .task .lane { position: relative; height: 20px; background: var(--track); border-radius: 4px; }
      .task .span { position: absolute; height: 100%; border-radius: 4px; background: var(--accent); }
      .task .span.gate { background: var(--grade-x); }
      .task .span.free { background: var(--grade-a); }

      .axis { position: relative; height: 46px; margin-top: 8px; }
      .axis .tick { position: absolute; font-family: var(--mono); font-size: 11px; color: var(--faint); transform: translateX(-50%); }
      .axis .dot { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--muted); transform: translate(-50%, -50%); top: 12px; }
      .axis .dot.mine { background: var(--accent); width: 15px; height: 15px; }

      .dials { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
      .dial label { display: block; font-size: 12px; color: var(--muted); font-family: var(--mono); margin-bottom: 4px; }
      .dial input { width: 100%; }
      .chainout { margin-top: 16px; font-size: 14px; }
      .err { color: var(--grade-x); font-family: var(--mono); }

      /* ---------------------------------------------------------------- explainer cards
       * A widget that only draws a shape makes the reader do the interpreting. These carry the
       * interpretation with them: a framing line, prose with the numbers that matter, live tiles,
       * an annotated chart, and a callout that says what the current state *means*.
       */
      .frame { font-size: 13.5px; color: var(--muted); margin: 0 0 10px; max-width: 66ch; }
      .explainer { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
      .explainer > h3 { font-family: var(--display); font-size: 1.25rem; letter-spacing: -0.015em; margin: 0 0 8px; }
      .explainer .intro { font-size: 13.6px; color: var(--muted); margin: 0 0 16px; max-width: 72ch; }
      .explainer .intro b { color: var(--ink); font-weight: 600; }

      .subpanel { background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 14px 16px; margin-bottom: 12px; }
      .subpanel > .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); font-weight: 700; margin-bottom: 8px; }

      .dialrow { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 12px; }
      .dialrow .name { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
      .dialrow .read { font-family: var(--display); font-size: 1.5rem; font-weight: 600; color: var(--accent); letter-spacing: -0.02em; }
      .dialrow .read .u { font-size: 0.75rem; color: var(--muted); margin-left: 3px; }
      .ticks { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--faint); margin-top: 2px; }

      .presets { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .presets .plabel { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); font-weight: 700; margin-right: 4px; }

      .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 10px; margin-bottom: 12px; }
      .tile { background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; }
      .tile .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
      .tile .big { font-family: var(--display); font-size: 1.7rem; font-weight: 600; letter-spacing: -0.02em; margin: 3px 0 2px; }
      .tile .sub { font-size: 11.5px; color: var(--muted); }
      .tile.good .big { color: var(--grade-a); }
      .tile.warn .big { color: var(--grade-b); }
      .tile.bad .big { color: var(--grade-x); }

      .callout { border-radius: 11px; padding: 13px 15px; font-size: 13px; border-left: 3px solid var(--accent); background: var(--accent-soft); }
      .callout .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; display: block; }
      .callout.warn { border-left-color: var(--grade-b); background: color-mix(in srgb, var(--grade-b) 12%, transparent); }
      .callout.bad { border-left-color: var(--grade-x); background: color-mix(in srgb, var(--grade-x) 12%, transparent); }
      .callout.good { border-left-color: var(--grade-a); background: color-mix(in srgb, var(--grade-a) 12%, transparent); }
      .callout b { font-weight: 600; }

      .footnote { font-size: 11.5px; color: var(--faint); margin: 10px 0 0; max-width: 72ch; }
      .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
      .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; font-style: normal; }

      /* ------------------------------------------------------------------ print
       *
       * Ctrl+P → Save as PDF *is* the submission, so the printed page is a first-class output
       * rather than a degraded screenshot. Three things make that work:
       *
       *   1. Widgets animate on scroll, so anything the reader never reached would print empty.
       *      A beforeprint handler plays every widget to its end state first (see playAll below).
       *   2. Controls disappear. A slider is meaningless on paper, and its end state is what the
       *      argument rests on anyway.
       *   3. Nothing splits mid-widget. The spec asks for forced breaks between sections, but
       *      twelve forced breaks is twelve pages against a four-page budget — so breaks are
       *      *avoided inside* figures instead, and sections flow.
       *
       * The length budget is enforced here rather than by editing discipline: when it runs long,
       * prose tightens and the widget stays.
       */
      @media print {
        @page { size: A4; margin: 12mm 14mm; }

        :root {
          --bg: #fff; --panel: #fff; --ink: #000; --muted: #333; --faint: #555;
          --line: #bbb; --accent: #0043a8; --track: #e8e8e8; --shadow: none;
        }
        body { background: #fff; color: #000; font-size: 8.6pt; line-height: 1.42; }
        .wrap { max-width: none; margin: 0; padding: 0; }

        /* Interaction has no meaning on paper. */
        .back, .controls, .replay, button, input[type="range"], nav { display: none !important; }

        h1 { font-size: 17pt; margin: 0 0 4pt; letter-spacing: -0.02em; }
        .eyebrow { font-size: 7pt; margin: 0 0 2pt; color: #444; }
        .lede { font-size: 9pt; max-width: none; margin: 0 0 8pt; }

        section {
          border-bottom: 0.5pt solid var(--line);
          padding: 0 0 5pt; margin: 0 0 6pt;
          break-inside: avoid; page-break-inside: avoid;
        }
        section h2 { font-size: 10.5pt; margin: 0 0 2pt; }
        section h2 .n { font-size: 7.5pt; }
        .claim { font-size: 8.4pt; margin: 0 0 4pt; max-width: none; }
        figure { break-inside: avoid; page-break-inside: avoid; }
        figcaption { font-size: 7.2pt; margin-top: 3pt; max-width: none; }

        .widget { border: 0.5pt solid var(--line); border-radius: 4pt; padding: 5pt 7pt; box-shadow: none; }
        .barrow { grid-template-columns: 110pt 1fr 52pt; gap: 5pt; font-size: 7.6pt; }
        .barrow .track { height: 7pt; }
        .bars { gap: 2.5pt; }
        .gatebox { font-size: 7.4pt; padding: 5pt 6pt; line-height: 1.45; }
        .stage { padding: 2pt 5pt; font-size: 7.6pt; opacity: 1 !important; }
        .task { font-size: 7.2pt; }
        .task .lane { height: 9pt; }
        .weeks { gap: 2pt; }
        .axis { height: 34pt; }
        .dials { gap: 5pt; }
        .verdictline { font-size: 7.8pt; margin-top: 4pt; }
        .chainout { font-size: 8pt; }

        /* Cross-references become endnotes: a printed page cannot be clicked. */
        a.ref { color: #000; border-bottom: 0; font-weight: 600; }
        a.ref::after { content: " [" attr(data-note) "]"; font-size: 6.6pt; vertical-align: super; font-weight: 400; }

        /* Provenance must survive the loss of colour — the marks are already shape, not hue. */
        .num[data-provenance="measured"] { border-bottom: 0.6pt solid #000; }
        .num[data-provenance="estimated"] { border-bottom: 0.6pt dotted #000; }
        .num[data-provenance="unknown"] { opacity: 1; font-style: italic; color: #555; }

        #endnotes { display: block !important; break-inside: avoid; font-size: 7pt; color: #333; }
        #endnotes h2 { font-size: 9pt; }
        #endnotes li { margin-bottom: 1pt; }
      }

      #endnotes { display: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="back" href="../"><span aria-hidden="true">←</span> Back</a>
      <p class="eyebrow">03 · Data collection</p>
      <h1>The decision</h1>
      <p class="lede">
        What to train an India-first model on, in what proportion, at what cost — and what would
        show it was the wrong call. Every number here links to the evidence behind it.
      </p>
      <main id="main"><p class="lede">Loading…</p></main>
      <footer id="foot"></footer>
    </div>

    <script type="module">
      import { renderNumber, formatValue } from '../_shared/num.js';
      import { animateOnce, countUp, prefersReducedMotion } from '../_shared/anim.js';

      const $ = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };

      /* Every widget registers how to reach its end state, so printing can force them all. */
      const playAll = [];

      /* Cross-references are numbered once, then reused, so the endnote list has no duplicates. */
      const refNotes = new Map();
      const ref = (text, anchor) => {
        const a = $('a', 'ref', text);
        a.href = `../reasoning#${anchor}`;
        if (!refNotes.has(anchor)) refNotes.set(anchor, refNotes.size + 1);
        a.dataset.note = String(refNotes.get(anchor));
        return a;
      };
      const fmt = (v, u) => formatValue(v, u);

      /* prose · widget · italic caption — the shape every section takes. */
      const sect = (n, title, claimNodes, widget, caption) => {
        const s = $('section');
        s.id = `s${n}`;
        const h = $('h2');
        h.append($('span', 'n', String(n)), document.createTextNode(title));
        s.append(h);
        const p = $('p', 'claim');
        claimNodes.forEach((c) => p.append(c));
        s.append(p);
        const fig = $('figure');
        fig.append(widget);
        if (caption) fig.append($('figcaption', '', caption));
        s.append(fig);
        return s;
      };

      const widget = (...kids) => { const w = $('div', 'widget'); w.append(...kids); return w; };

      /* A labelled bar row that animates its width from zero. */
      const barRow = (label, pct, valueNode, cls = '') => {
        const row = $('div', 'barrow');
        const track = $('div', 'track');
        const fill = $('div', `fill ${cls}`);
        track.append(fill);
        const val = $('div', 'val');
        if (valueNode instanceof Node) val.append(valueNode); else val.textContent = valueNode;
        row.append($('div', '', label), track, val);
        row._grow = () => countUp({ from: 0, to: pct, duration: 700, write: (v) => { fill.style.width = `${v}%`; } });
        return row;
      };

      const load = (p) => fetch(p).then((r) => { if (!r.ok) throw new Error(`${p}: ${r.status}`); return r.json(); });

      Promise.all([load('../data.json'), load('../records.json')])
        .then(([data, records]) => build(data, records))
        .catch((e) => { document.getElementById('main').innerHTML = `<p class="err">Could not load data — ${e.message}. Serve over http, not file://.</p>`; });

      function build(data, records) {
        const main = document.getElementById('main');
        main.replaceChildren();
        // Start at the rung you can actually build today. 15T stays flagged as the target the
        // atlas recommends, but opening on it invites reading an aspiration as a plan.
        const START = data.milestones.presets.find((p) => p.id === '5T') || data.milestones.presets[0];
        const rec = data.milestones.presets.find((p) => p.recommended) || data.milestones.presets[2];

        /* ---------------------------------------------------- 1 · The Gate */
        {
          const box = $('div', 'gatebox');
          const play = () => {
            box.replaceChildren();
            const fail = $('span', 'fail', 'CONTAMINATION GATE — FAILED\n');
            box.append(fail);
            box.append(
              `  a training shard collides with MILU on 12 of its 13-gram shingles\n` +
              `  action: drop the shard, or drop the benchmark from the eval set\n\n`);
            box.append($('span', 'pass', 'CLEAN SHARD — PASSED\n'));
            box.append('  no collisions against any registered benchmark');
          };
          const w = widget(box);
          animateOnce(w, play);
          playAll.push(play);
          main.append(sect(1, 'The gate that comes first',
            [document.createTextNode('Everything else here is an argument about proportions. This one is a hard stop: if training text overlaps the evaluation set, every score afterwards is fiction. So the contamination check is built before any of it — plant a known benchmark item in an ordinary shard and the build fails and '),
             $('b', '', 'names the benchmark'),
             document.createTextNode('. It runs in CI, so it cannot be forgotten. Coverage today is limited by what eval items we hold — see '),
             ref('the instruments', 'benchmarks'), document.createTextNode('.')],
            w,
            'Reproduced from the test suite. A gate that has never been watched to fail is not a gate.'));
        }

        /* ---------------------------------------------------- 2 · Vocab crossing */
        {
          const sw = data.vocab_sweep;
          const curve = sw.curve;
          const W = 640, H = 200, pad = 34;
          const xs = (i) => pad + (i / (curve.length - 1)) * (W - pad * 2);
          const maxNet = Math.max(...curve.map((c) => c.net_benefit));
          const minNet = Math.min(...curve.map((c) => c.net_benefit));
          const ys = (v) => H - pad - ((v - minNet) / (maxNet - minNet || 1)) * (H - pad * 2);
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
          svg.setAttribute('width', '100%');
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('fill', 'none');
          path.setAttribute('stroke', 'var(--accent)');
          path.setAttribute('stroke-width', '2');
          path.setAttribute('d', curve.map((c, i) => `${i ? 'L' : 'M'}${xs(i)},${ys(c.net_benefit)}`).join(' '));
          const peakI = curve.findIndex((c) => c.vocab_size === sw.peak.vocab_size);
          const mark = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          mark.setAttribute('cx', xs(peakI)); mark.setAttribute('cy', ys(sw.peak.net_benefit));
          mark.setAttribute('r', '5'); mark.setAttribute('fill', 'var(--accent)');
          const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          lbl.setAttribute('x', xs(peakI)); lbl.setAttribute('y', ys(sw.peak.net_benefit) - 12);
          lbl.setAttribute('text-anchor', 'middle'); lbl.setAttribute('font-size', '12');
          lbl.setAttribute('fill', 'var(--ink)'); lbl.setAttribute('font-family', 'var(--mono)');
          lbl.textContent = `peak ${fmt(sw.peak.vocab_size, 'count')}`;
          svg.append(path, mark, lbl);

          const note = $('p', 'val');
          note.style.cssText = 'font-family:var(--mono);font-size:12px;color:var(--muted);margin:10px 0 0';
          note.textContent = sw.note;
          const w = widget(svg, note);
          main.append(sect(2, 'How big the vocabulary should be',
            [document.createTextNode('Two costs pull against each other. A bigger vocabulary means fewer tokens per word — every Indic sentence gets cheaper for the whole run — but the output projection grows with it, taxing every forward pass. The answer is where the net is deepest. It is a shallow optimum, which is the useful part: being 40,000 slots out costs almost nothing, so this is not a decision to agonise over. The curve is '),
             $('b', '', 'not yet anchored on a measurement'),
             document.createTextNode(' — see '), ref('the tokenizer tax', 'fertility'), document.createTextNode('.')],
            w,
            'Net benefit against vocabulary size. Flat around the peak — the precise number matters less than being in the region.'));
        }

        /* ---------------------------------------------------- 3 · The Tax */
        {
          const f = data.fertility.by_language;
          const unknownCount = Object.values(f).filter((v) => v.value === null).length;
          const rows = $('div', 'bars');
          const empty = $('p');
          empty.style.cssText = 'font-size:13.5px;color:var(--muted);margin:0';
          empty.append(document.createTextNode(`All ${Object.keys(f).length} languages report `));
          empty.append(renderNumber(Object.values(f)[0], { unit: false }));
          empty.append(document.createTextNode(' — the measurement run has not happened. The honest version of this chart is an empty one.'));
          rows.append(empty);
          const target = $('p');
          target.style.cssText = 'font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:14px 0 0';
          target.append(document.createTextNode('target: worst Indic language ≤ '));
          target.append(renderNumber(data.fertility.parity_target));
          target.append(document.createTextNode(' × English'));
          main.append(sect(3, 'What the tokenizer costs',
            [document.createTextNode('An English-centric vocabulary charges Indic scripts several tokens where English pays one. That multiplier applies to every token of the entire run, so it outweighs almost any decision about corpus size — and unlike data, you cannot fix it later. This is the one table on the site that is deliberately '),
             $('b', '', 'empty'),
             document.createTextNode(': the rule is that fertility is measured, never estimated, and the run has not happened.')],
            widget(rows, target),
            `${unknownCount} of ${Object.keys(f).length} languages unmeasured. Publishing a plausible number here would be the exact failure this framework exists to prevent.`));
        }

        /* ---------------------------------------------------- 4 · The Budget */
        {
          const host = $('div');
          const ctr = $('div', 'controls');
          let current = START;
          const draw = () => {
            const bars = $('div', 'bars');
            const total = current.mix.total_seen_tokens;
            current.mix.tiers.forEach((t) => {
              const cls = t.is_synthetic ? 'synth' : t.is_indic ? 'indic' : '';
              const row = barRow(t.name, (t.seen_tokens / total) * 100,
                renderNumber({ value: t.seen_tokens, unit: 'tokens', provenance: 'estimated', source: 'computed:milestones' }, { unit: false }), cls);
              bars.append(row);
            });
            const sum = $('p');
            sum.style.cssText = 'font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:14px 0 0';
            sum.append(document.createTextNode('seen '), renderNumber({ value: total, unit: 'tokens', provenance: 'estimated', source: 'computed:milestones' }, { unit: false }),
              document.createTextNode(` · unique `), renderNumber({ value: current.mix.total_unique_tokens, unit: 'tokens', provenance: 'estimated', source: 'computed:milestones' }, { unit: false }),
              document.createTextNode(` · Indic ${(current.mix.indic_share * 100).toFixed(1)}% of which ${(current.mix.natural_indic_share * 100).toFixed(1)}% natural`));
            host.replaceChildren(bars, sum);
            current.findings.forEach((fnd) => {
              const p = $('p');
              p.style.cssText = 'font-size:12.5px;color:var(--muted);margin:8px 0 0';
              p.textContent = `${fnd.level}: ${fnd.message}`;
              host.append(p);
            });
            [...bars.children].forEach((r, i) => { if (r._grow) setTimeout(r._grow, prefersReducedMotion() ? 0 : i * 45); });
          };
          data.milestones.presets.forEach((p) => {
            const b = $('button', 'seg', p.id);
            b.type = 'button';
            b.setAttribute('aria-pressed', String(p === START));
            b.addEventListener('click', () => {
              current = p;
              [...ctr.children].forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
              draw();
            });
            ctr.append(b);
          });
          const w = widget(ctr, host);
          draw();
          animateOnce(w, draw);
          playAll.push(draw);
          main.append(sect(4, 'How many tokens, and where from',
            [document.createTextNode('The budget is not "collect 15 trillion tokens". It is a unique pool read on a schedule: repetition up to about four passes is nearly as good as fresh data, so a small Indic pool read four times contributes far more than its size suggests. That single reframing lifts the natural-Indic share several times over without collecting one new document — see '),
             ref('the priors', 'priors'), document.createTextNode('. It opens on 5T — the rung buildable from open sources today; 15T is the target the research recommends, not a starting position.')],
            w,
            'Switch rungs to see the same tier shape scaled. Orange is manufactured text; blue is natural Indic.'));
        }

        /* ---------------------------------------------------- 5 · The Filter */
        {
          const langs = records.languages || [];
          const host = $('div');
          const slider = document.createElement('input');
          slider.type = 'range'; slider.min = '0'; slider.max = '3'; slider.value = '0'; slider.step = '1';
          const label = $('div');
          label.style.cssText = 'font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:10px';
          const draw = () => {
            const th = Number(slider.value);
            const kept = langs.filter((l) => (l.tier || 3) <= Math.max(1, 4 - th) || th === 0);
            const survivors = th === 0 ? langs : langs.filter((l) => (l.tier || 3) <= (4 - th));
            label.textContent = th === 0
              ? `no quality threshold — all ${langs.length} languages present`
              : `threshold ${th} — ${survivors.length} of ${langs.length} languages survive`;
            const grid = $('div');
            grid.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px';
            langs.forEach((l) => {
              const chip = $('span', '', l.name || l.code);
              const alive = survivors.includes(l);
              chip.style.cssText =
                `font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:5px;border:1px solid var(--line);` +
                `color:${alive ? `var(--lang-tier-${l.tier || 3})` : 'var(--faint)'};opacity:${alive ? 1 : 0.32};` +
                `text-decoration:${alive ? 'none' : 'line-through'}`;
              grid.append(chip);
            });
            host.replaceChildren(grid);
            void kept;
          };
          slider.addEventListener('input', draw);
          draw();
          const w = widget(label, slider, host);
          main.append(sect(5, 'What a quality filter quietly deletes',
            [document.createTextNode('Quality classifiers are trained on English proxies, so they score thin-resource languages as noise. Raise the threshold and the languages with least data disappear first — the ones the model exists to serve. One language in this set collapses to '),
             $('b', '', '77 words'),
             document.createTextNode(' after standard filtering. The fix is a reserved share of every batch that no selector may touch; details in '),
             ref('the languages', 'languages'), document.createTextNode('.')],
            w,
            'Drag the threshold. Nothing here is a bug in the filter — it is the filter working as designed, on the wrong objective.'));
        }

        /* ---------------------------------------------------- 6 · The Mix + orphans */
        {
          const bars = $('div', 'bars');
          const total = rec.mix.total_seen_tokens;
          const covered = new Set(data.coverage.capabilities.filter((c) => c.count > 0).map((c) => c.capability));
          rec.mix.tiers.forEach((t) => {
            const caps = t.capabilities || [];
            const orphan = caps.length > 0 && !caps.some((c) => covered.has(c));
            const row = barRow(t.name + (orphan ? '  (no instrument)' : ''), (t.seen_tokens / total) * 100,
              `${((t.seen_tokens / total) * 100).toFixed(1)}%`, orphan ? 'gap' : t.is_indic ? 'indic' : '');
            bars.append(row);
          });
          const gapNote = $('p');
          gapNote.style.cssText = 'font-size:12.5px;color:var(--muted);margin:12px 0 0';
          gapNote.append(document.createTextNode('Hatched bars are tiers no benchmark would notice the removal of. That is not an argument to cut them — it is an argument you have to make out loud. See '), ref('the gaps', 'gaps'), document.createTextNode('.'));
          const w = widget(bars, gapNote);
          const grow6 = () => [...bars.children].forEach((r) => { if (r._grow) r._grow(); });
          animateOnce(w, () => [...bars.children].forEach((r, i) => { if (r._grow) setTimeout(r._grow, prefersReducedMotion() ? 0 : i * 45); }));
          playAll.push(grow6);
          main.append(sect(6, 'The mix, and what it cannot see',
            [document.createTextNode('The recommended shape, and an honest note attached to it: some tiers are paid for and unmeasurable. Delete them and every instrument reports the same score.')],
            w, 'Widths are share of seen tokens in the recommended budget.'));
        }

        /* ---------------------------------------------------- 7 · The Pipeline */
        {
          const tools = records.tools || [];
          const stages = [...new Set(tools.map((t) => t.stage))];
          const list = $('div', 'stages');
          const rows = stages.map((st, i) => {
            const row = $('div', 'stage');
            const picks = tools.filter((t) => t.stage === st);
            const verdicts = $('span');
            picks.slice(0, 3).forEach((t) => {
              const c = $('span', `verdict ${t.verdict}`, t.name);
              c.style.cssText = `font-family:var(--mono);font-size:11px;margin-left:6px;padding:1px 6px;border-radius:4px;border:1px solid currentColor;color:var(${t.verdict === 'avoid' ? '--grade-x' : t.verdict === 'build' ? '--accent' : '--grade-a'})`;
              if (t.verdict === 'avoid') c.style.textDecoration = 'line-through';
              verdicts.append(c);
            });
            row.append($('span', 'idx', String(i + 1)), $('span', '', st), verdicts);
            list.append(row);
            return row;
          });
          const w = widget(list);
          const litAll = () => rows.forEach((r) => r.classList.add('on'));
          animateOnce(w, () => {
            rows.forEach((r) => r.classList.remove('on'));
            rows.forEach((r, i) => setTimeout(() => r.classList.add('on'), prefersReducedMotion() ? 0 : i * 260));
          });
          playAll.push(litAll);
          main.append(sect(7, 'The pipeline you have to build',
            [document.createTextNode('Nine stages between a URL and a training shard. Most have a tool worth adopting; one has a tool worth avoiding, and the struck-through entry is a recommendation this research reversed on itself after measuring it. Full verdicts in '),
             ref('the tools', 'tools'), document.createTextNode('.')],
            w, 'Stages light in order. Struck-through tools are ones to avoid, not adopt.'));
        }

        /* ---------------------------------------------------- 8 · The Instruments */
        {
          const bars = $('div', 'bars');
          const max = Math.max(...data.coverage.capabilities.map((c) => c.count), 1);
          data.coverage.capabilities.forEach((c) => {
            bars.append(barRow(c.capability, (c.count / max) * 100, String(c.count), c.count <= 1 ? 'gap' : ''));
          });
          const w = widget(bars);
          const grow8 = () => [...bars.children].forEach((r) => { if (r._grow) r._grow(); });
          animateOnce(w, () => [...bars.children].forEach((r, i) => { if (r._grow) setTimeout(r._grow, prefersReducedMotion() ? 0 : i * 40); }));
          playAll.push(grow8);
          main.append(sect(8, 'Whether you could tell if it worked',
            [document.createTextNode('Every capability the model is built for, against the number of benchmarks that can detect it. A capability with one instrument is a coverage risk; with none, it is a goal you cannot grade. Trust bands and split policies in '),
             ref('the instruments', 'benchmarks'), document.createTextNode('.')],
            w, 'Hatched rows have one instrument or none.'));
        }

        /* ---------------------------------------------------- 9 · Competitive frame */
        {
          const arch = (records.architectures || []).filter((a) => a.params_total);
          const mine = { model: 'this model', params_total: 40e9, params_active: 40e9, mine: true };
          const all = [...arch, mine];
          let mode = 'total';
          const host = $('div', 'axis');
          const ctr = $('div', 'controls');
          const draw = () => {
            host.replaceChildren();
            const vals = all.map((a) => (mode === 'active' ? a.params_active || a.params_total : a.params_total));
            const max = Math.max(...vals), min = Math.min(...vals);
            const pos = (v) => ((Math.log10(v) - Math.log10(min)) / (Math.log10(max) - Math.log10(min) || 1)) * 92 + 4;
            all.forEach((a, i) => {
              const v = vals[i];
              const dot = $('div', `dot${a.mine ? ' mine' : ''}`);
              dot.style.left = `${pos(v)}%`;
              dot.title = `${a.model} — ${fmt(v, 'count')}`;
              const t = $('div', 'tick', `${a.model.split(' ')[0]} ${fmt(v, 'count')}`);
              t.style.left = `${pos(v)}%`;
              t.style.top = i % 2 ? '26px' : '0px';
              host.append(dot, t);
            });
          };
          ['total', 'active'].forEach((m) => {
            const b = $('button', 'seg', `${m} params`);
            b.type = 'button'; b.setAttribute('aria-pressed', String(m === mode));
            b.addEventListener('click', () => { mode = m; [...ctr.children].forEach((c) => c.setAttribute('aria-pressed', String(c === b))); draw(); });
            ctr.append(b);
          });
          draw();
          main.append(sect(9, 'What you are up against',
            [document.createTextNode('The comparison that matters is not the biggest model but the free one. A capable open-licensed model in this class means a from-scratch run has to justify itself against something anyone can download today — which is why the plan puts a head-to-head before any capital commitment. Architectures in '),
             ref('the evidence', 'papers'), document.createTextNode('.')],
            widget(ctr, host),
            'Log scale. Toggle to active parameters — sparse models move a long way left.'));
        }

        /* ---------------------------------------------------- 10 · Critical path */
        {
          const plan = records.plan || [];
          const maxWeek = Math.max(...plan.map((p) => p.week_end || p.week_start || 0), 12);
          const list = $('div', 'weeks');
          plan.forEach((p) => {
            const row = $('div', 'task');
            const lane = $('div', 'lane');
            const span = $('div', `span${p.is_gate ? ' gate' : ''}${(p.cost_inr === 0) ? ' free' : ''}`);
            const s = ((p.week_start || 1) - 1) / maxWeek * 100;
            const e = ((p.week_end || p.week_start || 1)) / maxWeek * 100;
            span.style.left = `${s}%`;
            span.style.width = `${Math.max(3, e - s)}%`;
            span.title = `${p.action}${p.is_gate ? ' — GATE' : ''}`;
            lane.append(span);
            row.append($('span', '', p.id), lane);
            list.append(row);
          });
          const key = $('p');
          key.style.cssText = 'font-family:var(--mono);font-size:12px;color:var(--muted);margin:12px 0 0';
          key.textContent = `${plan.filter((p) => p.is_gate).length} gates (red) — nothing downstream should start until they clear`;
          main.append(sect(10, 'The order to do it in',
            [document.createTextNode('Twelve actions. Two are gates rather than tasks: until the tokenizer is validated and the from-scratch question is settled at small scale, committing capital is guessing. The three highest-value items are letters, not engineering — see '),
             ref('the acquisitions', 'acquisition'), document.createTextNode('.')],
            widget(list, key),
            'Bars are week spans. Hover any bar for the action.'));
        }

        /* ---------------------------------------------------- 11 · The repetition explorer
         *
         * The exemplar for how a widget on this site should teach: the chart shows the decay, the
         * tiles show what the current setting costs, and the callout says in words what that
         * means — so a reader who never touches a control still leaves with the idea.
         */
        {
          // Defaults are the atlas's own proposal: a ~300B natural-Indic pool read four times.
          const state = { pool: 300, target: 1200 };
          const KNEE = 4, CEILING = 16;

          const card = $('div', 'explainer');
          card.append($('h3', '', 'When the text runs out, how many times can you re-read it?'));
          const intro = $('p', 'intro');
          intro.append(
            document.createTextNode('Only so much natural Indian-language text exists, so to reach a token budget you '),
            $('b', '', 'repeat'), document.createTextNode(' the corpus across epochs. The useful finding is that the first few passes are nearly '),
            $('b', '', 'free'), document.createTextNode(' — a token seen a second, third or fourth time is worth almost as much as a fresh one. Past roughly '),
            $('b', '', '4 epochs'), document.createTextNode(' the value decays, and by about '),
            $('b', '', '16'), document.createTextNode(' extra passes buy almost nothing. Set the pool you actually have and how many tokens you want to draw from it, and watch where the run lands.'));
          card.append(intro);

          // --- dials
          const dialWrap = $('div', 'subpanel');
          const mkDial = (key, name, unitLabel, min, max, step, ticks, fmtRead) => {
            const row = $('div', 'dialrow');
            const read = $('div', 'read');
            row.append($('div', 'name', name), read);
            const inp = document.createElement('input');
            inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = state[key];
            inp.style.width = '100%';
            inp.setAttribute('aria-label', name);
            const tickRow = $('div', 'ticks');
            ticks.forEach((t) => tickRow.append($('span', '', t)));
            inp.addEventListener('input', () => { state[key] = Number(inp.value); draw(); });
            const box = $('div');
            box.style.marginBottom = '12px';
            box.append(row, inp, tickRow);
            dialWrap.append(box);
            return { inp, read, fmtRead, unitLabel };
          };
          const poolDial = mkDial('pool', 'unique Indic pool', 'unique', 50, 2000, 25,
            ['50B', '300B', '1T', '2T'], (v) => fmt(v * 1e9, 'tokens'));
          const targetDial = mkDial('target', 'tokens wanted from this pool', 'drawn', 100, 4000, 50,
            ['100B', '1T', '2T', '4T'], (v) => fmt(v * 1e9, 'tokens'));

          // --- presets tied to the real milestone ladder
          const presetRow = $('div', 'presets');
          presetRow.append($('span', 'plabel', 'natural-Indic slice of'));
          data.milestones.presets.forEach((p) => {
            // How much of that rung the mix actually asks the natural-Indic tier to supply.
            const tier = p.mix.tiers.find((x) => x.name === 'indic-natural');
            const drawn = tier ? tier.seen_tokens / 1e9 : p.target_seen_tokens * 0.08 / 1e9;
            const b = $('button', 'seg', `${p.id} → ${fmt(drawn * 1e9, 'tokens')}`);
            b.type = 'button';
            b.addEventListener('click', () => {
              state.target = Math.round(drawn);
              targetDial.inp.value = String(state.target);
              draw();
            });
            presetRow.append(b);
          });
          dialWrap.append(presetRow);
          card.append(dialWrap);

          const tiles = $('div', 'tiles');
          const chartBox = $('div', 'subpanel');
          chartBox.append($('div', 'lbl', 'value of each repeated pass, as it flattens and then dies'));
          const chartHost = $('div');
          chartBox.append(chartHost);
          const callout = $('div', 'callout');
          card.append(tiles, chartBox, callout);

          /* Value of the Nth pass, decaying toward zero — the shape Muennighoff et al. report. */
          const passValue = (n) => (n <= 1 ? 1 : Math.exp(-(n - 1) / (CEILING / 2.2)));

          const drawChart = (epochs) => {
            const W = 640, H = 210, L = 42, B = 30;
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
            svg.setAttribute('width', '100%');
            const maxN = 20;
            const x = (n) => L + (n / maxN) * (W - L - 12);
            const y = (v) => H - B - v * (H - B - 14);
            const zone = (a, b, fill) => {
              const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
              r.setAttribute('x', x(a)); r.setAttribute('y', 10);
              r.setAttribute('width', x(b) - x(a)); r.setAttribute('height', H - B - 10);
              r.setAttribute('fill', fill); svg.append(r);
            };
            zone(0, KNEE, 'color-mix(in srgb, var(--grade-a) 13%, transparent)');
            zone(KNEE, CEILING, 'color-mix(in srgb, var(--grade-b) 13%, transparent)');
            zone(CEILING, maxN, 'color-mix(in srgb, var(--grade-x) 13%, transparent)');
            [['free', KNEE / 2, 'var(--grade-a)'], ['diminishing', (KNEE + CEILING) / 2, 'var(--grade-b)'], ['wasted', (CEILING + maxN) / 2, 'var(--grade-x)']]
              .forEach(([label, at, col]) => {
                const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                t.setAttribute('x', x(at)); t.setAttribute('y', 22); t.setAttribute('text-anchor', 'middle');
                t.setAttribute('font-size', '10'); t.setAttribute('font-family', 'var(--mono)');
                t.setAttribute('fill', col); t.textContent = label.toUpperCase();
                svg.append(t);
              });
            const pts = [];
            for (let n = 1; n <= maxN; n += 0.5) pts.push(`${n === 1 ? 'M' : 'L'}${x(n)},${y(passValue(n))}`);
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', pts.join(' '));
            path.setAttribute('fill', 'none'); path.setAttribute('stroke', 'var(--accent)'); path.setAttribute('stroke-width', '2');
            svg.append(path);
            // where this run actually sits
            const here = Math.min(epochs, maxN);
            const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            dot.setAttribute('cx', x(here)); dot.setAttribute('cy', y(passValue(here)));
            dot.setAttribute('r', '6'); dot.setAttribute('fill', 'var(--accent)');
            const lab = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            lab.setAttribute('x', x(here)); lab.setAttribute('y', y(passValue(here)) - 12);
            lab.setAttribute('text-anchor', 'middle'); lab.setAttribute('font-size', '11');
            lab.setAttribute('font-family', 'var(--mono)'); lab.setAttribute('fill', 'var(--ink)');
            lab.textContent = `${epochs.toFixed(1)}×`;
            svg.append(dot, lab);
            [0, 4, 8, 12, 16, 20].forEach((n) => {
              const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
              t.setAttribute('x', x(n)); t.setAttribute('y', H - 10); t.setAttribute('text-anchor', 'middle');
              t.setAttribute('font-size', '10'); t.setAttribute('fill', 'var(--faint)'); t.setAttribute('font-family', 'var(--mono)');
              t.textContent = String(n); svg.append(t);
            });
            const ax = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            ax.setAttribute('x', W / 2); ax.setAttribute('y', H - 1); ax.setAttribute('text-anchor', 'middle');
            ax.setAttribute('font-size', '9.5'); ax.setAttribute('fill', 'var(--faint)');
            ax.textContent = 'number of epochs (times the pool is repeated)';
            svg.append(ax);
            return svg;
          };

          const tile = (lbl, big, sub, cls = '') => {
            const t = $('div', `tile ${cls}`);
            const b = $('div', 'big');
            if (big instanceof Node) b.append(big); else b.textContent = big;
            t.append($('div', 'lbl', lbl), b, $('div', 'sub', sub));
            return t;
          };

          const draw = () => {
            const poolTokens = state.pool * 1e9;
            const target = state.target * 1e9;
            const epochs = target / poolTokens;
            const lastWorth = passValue(Math.max(1, epochs));
            // Effective tokens: sum the decaying value of each pass actually run.
            let effective = 0;
            for (let n = 1; n <= Math.floor(epochs); n += 1) effective += poolTokens * passValue(n);
            effective += poolTokens * (epochs % 1) * passValue(Math.ceil(epochs));

            poolDial.read.replaceChildren(document.createTextNode(poolDial.fmtRead(state.pool)),
              $('span', 'u', poolDial.unitLabel));
            targetDial.read.replaceChildren(document.createTextNode(targetDial.fmtRead(state.target)),
              $('span', 'u', targetDial.unitLabel));

            const band = epochs <= KNEE ? 'good' : epochs <= CEILING ? 'warn' : 'bad';
            tiles.replaceChildren(
              tile('required epochs', `${epochs.toFixed(1)}×`,
                `${fmt(target, 'tokens')} drawn ÷ ${fmt(poolTokens, 'tokens')} unique`, band),
              tile('effective tokens gained',
                renderNumber({ value: effective, unit: 'tokens', provenance: 'estimated', source: 'computed:repetition' }, { unit: false }),
                `${((effective / target) * 100).toFixed(0)}% of what you draw does real work`, band),
              tile('the last pass is worth', `${(lastWorth * 100).toFixed(0)}%`,
                'of a fresh token', band));

            chartHost.replaceChildren(drawChart(epochs));

            callout.className = `callout ${band}`;
            callout.replaceChildren();
            const label = epochs <= KNEE ? 'Repetition is doing this for free'
              : epochs <= CEILING ? 'Diminishing returns' : 'Past the ceiling';
            callout.append($('span', 'lbl', label));
            const msg = $('span');
            if (epochs <= KNEE) {
              msg.append(document.createTextNode(`At ${epochs.toFixed(1)} passes you are inside the free zone: the pool carries the budget without a meaningful quality penalty. This is the lever that lifts the Indic share `),
                $('b', '', 'without collecting a single new document'), document.createTextNode('.'));
            } else if (epochs <= CEILING) {
              msg.append(document.createTextNode(`${epochs.toFixed(1)} passes carries you past the ~4-epoch knee, so each extra pass is worth less than the last and the budget delivers only `),
                $('b', '', fmt(effective, 'tokens')), document.createTextNode(' of effective data. What helps here is more unique text, not more compute — see '),
                ref('what exists', 'data'), document.createTextNode('.'));
            } else {
              msg.append(document.createTextNode(`${epochs.toFixed(1)} passes is past the point where repetition buys anything. `),
                $('b', '', 'Raising the budget from here mostly burns compute'),
                document.createTextNode(' — the pool has to grow, or the target has to come down.'));
            }
            callout.append(msg);
          };

          const legend = $('div', 'legend');
          [['var(--grade-a)', `free zone · ≤${KNEE} epochs`], ['var(--grade-b)', 'diminishing'], ['var(--grade-x)', `wasted · >${CEILING}`]]
            .forEach(([c, t]) => { const l = $('span'); const i = $('i'); i.style.background = c; l.append(i, t); legend.append(l); });
          card.append(legend);
          card.append($('p', 'footnote',
            'The decay shape follows the data-constrained scaling result in the priors; the knee and ceiling are that paper\'s, measured on English web text at small scale. Nobody has measured them for Indic, translated or synthetic text — which is one of the four unknowns.'));

          draw();
          playAll.push(draw);

          const frame = $('p', 'frame');
          frame.textContent = 'A large token target immediately creates a supply problem. The first option is to read the same text more than once.';
          const s = sect(11, 'Reading it twice', [], card, null);
          s.insertBefore(frame, s.children[1]);
          main.append(s);
        }

        /* ---------------------------------------------------- 12 · The Verdict */
        {
          const box = $('div');
          const line = (chip, cls, text) => {
            const v = $('div', 'verdictline');
            v.append($('span', `chip ${cls}`, chip), $('span', '', text));
            return v;
          };
          box.append(
            line('WIN', 'win', 'Indic breadth and India-context knowledge — nothing open covers 22 languages with this weighting.'),
            line('PARITY', 'parity', 'English reasoning and code — the corpus is the same public corpus everyone else uses.'),
            line('LOSE', 'lose', 'Anything gated behind licensed data nobody will sell you, and any claim that needs a benchmark that does not exist.'),
          );
          const scope = $('p');
          scope.style.cssText = 'font-size:13px;color:var(--muted);margin:16px 0 0;max-width:62ch';
          scope.append(document.createTextNode('The honest scope line: the single number this all rests on — how much deduplicated natural Indic text exists — has never been measured by anyone, and the fertility figures are still unrun. Both are in '),
            ref('the unknowns', 'risks'), document.createTextNode('. This is a plan with its uncertainty attached, not a result.'));
          main.append(sect(12, 'The verdict',
            [document.createTextNode('Where this model would beat the open alternatives, where it would only match them, and where it would lose.')],
            widget(box, scope), null));
        }

        const counts = data.record_counts;
        document.getElementById('foot').textContent =
          `Built from ${counts.catalog} datasets, ${counts.benchmarks} benchmarks and ${counts.legal} legal records. Pipeline ${data.pipeline_version}.`;

        /* ---------------------------------------------------- endnotes + print
         *
         * A printed cross-reference is useless as a link, so each one is numbered in the text and
         * resolved here. And because widgets animate on scroll, printing without playing them
         * first would emit blank charts for every section the reader never reached.
         */
        const notes = $('section');
        notes.id = 'endnotes';
        notes.append($('h2', '', 'References'));
        const ol = document.createElement('ol');
        [...refNotes.entries()]
          .sort((a, b) => a[1] - b[1])
          .forEach(([anchor]) => ol.append($('li', '', `The reasoning · ${anchor}`)));
        notes.append(ol);
        main.append(notes);

        const forceEndStates = () => playAll.forEach((play) => { try { play(); } catch { /* a widget that cannot replay still prints its current state */ } });
        window.addEventListener('beforeprint', forceEndStates);
        // Safari and some PDF engines never fire beforeprint; the media query is the reliable hook.
        window.matchMedia('print').addEventListener?.('change', (e) => { if (e.matches) forceEndStates(); });
      }
    </script>
  </body>
</html>
