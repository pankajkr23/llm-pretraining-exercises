<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Decision — what to train an Indian language model on</title>
    <meta
      name="description"
      content="The argument end to end: what to train on, in what proportion, at what it costs, and what would prove it wrong."
    />
    <link rel="stylesheet" href="../_shared/tokens.css" />
    <link rel="stylesheet" href="../_shared/explainer.css" />
    <style>
      .wrap { max-width: 820px; }
      section { padding-bottom: 40px; margin-bottom: 40px; border-bottom: 1px solid var(--line); }
      section:last-of-type { border-bottom: 0; }
      section h2 { display: flex; align-items: baseline; gap: 10px; }
      section h2 .n { font-family: var(--mono); font-size: 12px; color: var(--faint); }
      .claim { font-size: 1.02rem; max-width: 66ch; margin: 0 0 18px; }
      .claim b { font-weight: 600; }
      figure { margin: 0; }
      figcaption { font-size: 13px; color: var(--muted); font-style: italic; margin-top: 12px; max-width: 62ch; }
      a.ref { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }

      .widget { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
      .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
      button.seg {
        font-family: var(--mono); font-size: 12.5px; padding: 6px 13px; border-radius: 8px;
        border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer;
      }
      button.seg[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      input[type="range"] { accent-color: var(--accent); }

      .bars { display: grid; gap: 7px; }
      .barrow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 96px; gap: 10px; align-items: center; font-size: 13px; }
      .barrow .track { background: var(--track); border-radius: 5px; height: 15px; overflow: hidden; }
      .barrow .fill { height: 100%; background: var(--accent); border-radius: 5px; width: 0; transition: none; }
      .barrow .val { text-align: right; font-family: var(--mono); font-size: 12px; }
      .fill.indic { background: var(--lang-tier-1); }
      .fill.synth { background: var(--gotcha-composition); }
      .fill.gap { background: repeating-linear-gradient(45deg, var(--track), var(--track) 5px, var(--faint) 5px, var(--faint) 6px); }

      .verdictline { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-family: var(--mono); font-size: 13px; margin-top: 12px; }
      .chip { border: 1px solid currentColor; border-radius: 5px; padding: 1px 8px; font-size: 11.5px; font-weight: 700; }
      .chip.win { color: var(--grade-a); } .chip.parity { color: var(--grade-b); } .chip.lose { color: var(--grade-x); }

      .stages { display: grid; gap: 6px; }
      .stage { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; font-size: 13px; opacity: 0.45; }
      .stage.on { opacity: 1; border-color: var(--accent); background: var(--accent-soft); }
      .stage .idx { font-family: var(--mono); font-size: 11px; color: var(--faint); }

      .weeks { position: relative; display: grid; gap: 5px; }
      .task { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 12.5px; }
      .task .lane { position: relative; height: 20px; background: var(--track); border-radius: 4px; }
      .task .span { position: absolute; height: 100%; border-radius: 4px; background: var(--accent); }
      .task .span.gate { background: var(--grade-x); }
      .task .span.free { background: var(--grade-a); }

      .axis { position: relative; height: 46px; margin-top: 8px; }
      .axis .tick { position: absolute; font-family: var(--mono); font-size: 11px; color: var(--faint); transform: translateX(-50%); }
      .axis .dot { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--muted); transform: translate(-50%, -50%); top: 12px; }
      .axis .dot.mine { background: var(--accent); width: 15px; height: 15px; }

      .dials { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
      .dial label { display: block; font-size: 12px; color: var(--muted); font-family: var(--mono); margin-bottom: 4px; }
      .dial input { width: 100%; }
      .chainout { margin-top: 16px; font-size: 14px; }
      .err { color: var(--grade-x); font-family: var(--mono); }

      /* ---------------------------------------------------------------- explainer cards
       * A widget that only draws a shape makes the reader do the interpreting. These carry the
       * interpretation with them: a framing line, prose with the numbers that matter, live tiles,
       * an annotated chart, and a callout that says what the current state *means*.
       */
      .frame { font-size: 13.5px; color: var(--muted); margin: 0 0 10px; max-width: 66ch; }
      .explainer { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
      .explainer > h3 { font-family: var(--display); font-size: 1.25rem; letter-spacing: -0.015em; margin: 0 0 8px; }
      .explainer .intro { font-size: 13.6px; color: var(--muted); margin: 0 0 16px; max-width: 72ch; }
      .explainer .intro b { color: var(--ink); font-weight: 600; }

      .subpanel { background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 14px 16px; margin-bottom: 12px; }
      .subpanel > .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); font-weight: 700; margin-bottom: 8px; }

      .dialrow { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 12px; }
      .dialrow .name { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
      .dialrow .read { font-family: var(--display); font-size: 1.5rem; font-weight: 600; color: var(--accent); letter-spacing: -0.02em; }
      .dialrow .read .u { font-size: 0.75rem; color: var(--muted); margin-left: 3px; }
      .ticks { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--faint); margin-top: 2px; }

      .presets { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .presets .plabel { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); font-weight: 700; margin-right: 4px; }

      .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 10px; margin-bottom: 12px; }
      .tile { background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; }
      .tile .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
      .tile .big { font-family: var(--display); font-size: 1.7rem; font-weight: 600; letter-spacing: -0.02em; margin: 3px 0 2px; }
      .tile .sub { font-size: 11.5px; color: var(--muted); }
      .tile.good .big { color: var(--grade-a); }
      .tile.warn .big { color: var(--grade-b); }
      .tile.bad .big { color: var(--grade-x); }

      .callout { border-radius: 11px; padding: 13px 15px; font-size: 13px; border-left: 3px solid var(--accent); background: var(--accent-soft); }
      .callout .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; display: block; }
      .callout.warn { border-left-color: var(--grade-b); background: color-mix(in srgb, var(--grade-b) 12%, transparent); }
      .callout.bad { border-left-color: var(--grade-x); background: color-mix(in srgb, var(--grade-x) 12%, transparent); }
      .callout.good { border-left-color: var(--grade-a); background: color-mix(in srgb, var(--grade-a) 12%, transparent); }
      .callout b { font-weight: 600; }

      .footnote { font-size: 11.5px; color: var(--faint); margin: 10px 0 0; max-width: 72ch; }
      .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
      .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; font-style: normal; }

      /* ------------------------------------------------------------------ print
       *
       * Ctrl+P → Save as PDF *is* the submission, so the printed page is a first-class output
       * rather than a degraded screenshot. Three things make that work:
       *
       *   1. Widgets animate on scroll, so anything the reader never reached would print empty.
       *      A beforeprint handler plays every widget to its end state first (see playAll below).
       *   2. Controls disappear. A slider is meaningless on paper, and its end state is what the
       *      argument rests on anyway.
       *   3. Nothing splits mid-widget. The spec asks for forced breaks between sections, but
       *      twelve forced breaks is twelve pages against a four-page budget — so breaks are
       *      *avoided inside* figures instead, and sections flow.
       *
       * The length budget is enforced here rather than by editing discipline: when it runs long,
       * prose tightens and the widget stays.
       */
      @media print {
        @page { size: A4; margin: 12mm 14mm; }

        :root {
          --bg: #fff; --panel: #fff; --ink: #000; --muted: #333; --faint: #555;
          --line: #bbb; --accent: #0043a8; --track: #e8e8e8; --shadow: none;
        }
        body { background: #fff; color: #000; font-size: 8.6pt; line-height: 1.42; }
        .wrap { max-width: none; margin: 0; padding: 0; }

        /* Interaction has no meaning on paper. */
        .back, .controls, button, input[type="range"], nav { display: none !important; }

        h1 { font-size: 17pt; margin: 0 0 4pt; letter-spacing: -0.02em; }
        .eyebrow { font-size: 7pt; margin: 0 0 2pt; color: #444; }
        .lede { font-size: 9pt; max-width: none; margin: 0 0 8pt; }

        section {
          border-bottom: 0.5pt solid var(--line);
          padding: 0 0 5pt; margin: 0 0 6pt;
          break-inside: avoid; page-break-inside: avoid;
        }
        section h2 { font-size: 10.5pt; margin: 0 0 2pt; }
        section h2 .n { font-size: 7.5pt; }
        .claim { font-size: 8.4pt; margin: 0 0 4pt; max-width: none; }
        figure { break-inside: avoid; page-break-inside: avoid; }
        figcaption { font-size: 7.2pt; margin-top: 3pt; max-width: none; }

        .widget { border: 0.5pt solid var(--line); border-radius: 4pt; padding: 5pt 7pt; box-shadow: none; }
        .barrow { grid-template-columns: 110pt 1fr 52pt; gap: 5pt; font-size: 7.6pt; }
        .barrow .track { height: 7pt; }
        .bars { gap: 2.5pt; }
        /* Paper cannot scroll, so every attack prints with its own verdict beside it. */
        .scrolly { grid-template-columns: 1fr; gap: 0; }
        .step { min-height: 0; margin: 0 0 4pt; padding-left: 5pt; border-left-width: 1pt; }
        .step p, .step .shard { max-width: none; }
        .step .shard { font-size: 7pt; margin-top: 2pt; padding-top: 2pt; }
        .step .inline { display: block; font-size: 7.4pt; font-weight: 700; margin-top: 2pt; }
        .step .marg { font-size: 6.8pt; margin-bottom: 2pt; }
        .sticky { position: static; }
        .fig { padding: 4pt 0; border-top-width: 1pt; }
        .fig-big { font-size: 20pt; margin: 3pt 0 1pt; }
        .fig-tick { width: 5pt; height: 10pt; }
        .qbox { display: none; }
        .stage { padding: 2pt 5pt; font-size: 7.6pt; opacity: 1 !important; }
        .task { font-size: 7.2pt; }
        .task .lane { height: 9pt; }
        .weeks { gap: 2pt; }
        .axis { height: 34pt; }
        .dials { gap: 5pt; }
        .verdictline { font-size: 7.8pt; margin-top: 4pt; }
        .chainout { font-size: 8pt; }

        /* Cross-references become endnotes: a printed page cannot be clicked. */
        a.ref { color: #000; border-bottom: 0; font-weight: 600; }
        a.ref::after { content: " [" attr(data-note) "]"; font-size: 6.6pt; vertical-align: super; font-weight: 400; }

        /* Same logic on paper: mark the exceptional, leave the default alone. */
        .num[data-provenance="measured"] { border-bottom: 0.7pt solid #000; }
        .num[data-provenance="unknown"] { font-style: italic; color: #555; }
        .prov { font-size: 6.6pt; color: #555; }

        #endnotes { display: block !important; break-inside: avoid; font-size: 7pt; color: #333; }
        #endnotes h2 { font-size: 9pt; }
        #endnotes li { margin-bottom: 1pt; }
      }

      #endnotes { display: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="back" href="../"><span aria-hidden="true">←</span> Back</a>
      <p class="eyebrow">03 · Data collection</p>
      <h1>The decision</h1>
      <p class="lede">
        What to train an India-first model on, in what proportion, at what cost — and what would
        show it was the wrong call. Every number here links to the evidence behind it.
      </p>
      <main id="main"><p class="lede">Loading…</p></main>
      <footer id="foot"></footer>
    </div>

    <script type="module">
      import { renderNumber, formatValue } from '../_shared/num.js';
      import { makeExplainer } from '../_shared/explainer.js';
      import { animateOnce, countUp, prefersReducedMotion } from '../_shared/anim.js';

      const $ = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };

      /* Every widget registers how to reach its end state, so printing can force them all. */
      const playAll = [];

      /* Cross-references are numbered once, then reused, so the endnote list has no duplicates. */
      const refNotes = new Map();
      const ref = (text, anchor) => {
        const a = $('a', 'ref', text);
        a.href = `../reasoning#${anchor}`;
        if (!refNotes.has(anchor)) refNotes.set(anchor, refNotes.size + 1);
        a.dataset.note = String(refNotes.get(anchor));
        return a;
      };
      const fmt = (v, u) => formatValue(v, u);

      /* prose · widget · italic caption — the shape every section takes. */
      const sect = (n, title, claimNodes, widget, caption) => {
        const s = $('section');
        s.id = `s${n}`;
        const h = $('h2');
        h.append($('span', 'n', String(n)), document.createTextNode(title));
        s.append(h);
        const p = $('p', 'claim');
        claimNodes.forEach((c) => p.append(c));
        s.append(p);
        const fig = $('figure');
        fig.append(widget);
        if (caption) fig.append($('figcaption', '', caption));
        s.append(fig);
        return s;
      };

      const widget = (...kids) => { const w = $('div', 'widget'); w.append(...kids); return w; };

      const buildExplainer = makeExplainer({ $, onPlay: (fn) => playAll.push(fn) });

      const SVGNS = 'http://www.w3.org/2000/svg';
      const svgEl = (tag, attrs = {}) => {
        const e = document.createElementNS(SVGNS, tag);
        Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, String(v)));
        return e;
      };


      /* A live stat tile: label, big figure, and the arithmetic behind it in small type. */
      const tileOf = (lbl, big, sub, cls = '') => {
        const t = $('div', `tile ${cls}`);
        const b = $('div', 'big');
        if (big instanceof Node) b.append(big); else b.textContent = big;
        t.append($('div', 'lbl', lbl), b, $('div', 'sub', sub));
        return t;
      };

      /* A labelled bar row that animates its width from zero. */
      const barRow = (label, pct, valueNode, cls = '') => {
        const row = $('div', 'barrow');
        const track = $('div', 'track');
        const fill = $('div', `fill ${cls}`);
        track.append(fill);
        const val = $('div', 'val');
        if (valueNode instanceof Node) val.append(valueNode); else val.textContent = valueNode;
        row.append($('div', '', label), track, val);
        row._grow = () => countUp({ from: 0, to: pct, duration: 700, write: (v) => { fill.style.width = `${v}%`; } });
        return row;
      };

      const load = (p) => fetch(p).then((r) => { if (!r.ok) throw new Error(`${p}: ${r.status}`); return r.json(); });

      Promise.all([load('../data.json'), load('../records.json')])
        .then(([data, records]) => build(data, records))
        .catch((e) => { document.getElementById('main').innerHTML = `<p class="err">Could not load data — ${e.message}. Serve over http, not file://.</p>`; });

      function build(data, records) {
        const main = document.getElementById('main');
        main.replaceChildren();
        // Start at the rung you can actually build today. 15T stays flagged as the target the
        // atlas recommends, but opening on it invites reading an aspiration as a plan.
        const START = data.milestones.presets.find((p) => p.id === '5T') || data.milestones.presets[0];
        const rec = data.milestones.presets.find((p) => p.recommended) || data.milestones.presets[2];

        /* ---------------------------------------------------- 1 · The Gate (Adversary)
         *
         * The reader tries to smuggle a question they wrote past the contamination check, and the
         * scroll position performs the attacks. Everything on screen is computed here, in the
         * browser, from their sentence — no figure is asserted.
         *
         * normalise() and shingle() are ported from dataframework/shingles.py exactly. The pipeline
         * hashes each window with blake2b because its index ships publicly; nothing leaves this
         * page, so windows are compared as text and no digest is fabricated to look authentic.
         *
         * INV-1b: no benchmark item text may appear in the bundle, so the protected question is a
         * synthetic default the reader is invited to replace with their own.
         */
        {
          const N = 13; // dataframework/shingles.py SHINGLE_N
          const DEFAULT_Q =
            'In which year did the Indian Railways first run a scheduled passenger service ' +
            'between Bombay and Thane, and how long was that inaugural route in miles?';
          const LEAD = 'Ordinary web text about monsoon agriculture in the Gangetic plain. ';
          const TAIL = ' More ordinary web text about irrigation and canal systems.';

          const words = (t) => t.toLowerCase().match(/[\p{L}\p{N}_]+/gu) || [];
          const windows = (t) => {
            const w = words(t);
            if (!w.length) return [];
            if (w.length < N) return [w.join(' ')];
            return Array.from({ length: w.length - N + 1 }, (_, i) => w.slice(i, i + N).join(' '));
          };
          /* Insert a filler word every `gap` words. gap < N breaks every window; gap = Infinity is
           * a single insertion at the midpoint. Both are mechanical, so they work on any input. */
          const wedge = (text, gap) => {
            const parts = text.split(/(\s+)/).filter((s) => s.trim());
            if (gap === Infinity) {
              const at = Math.min(N, Math.floor(parts.length / 2));
              return [...parts.slice(0, at), 'roughly', ...parts.slice(at)].join(' ');
            }
            return parts.flatMap((w, i) => ((i + 1) % gap === 0 ? [w, 'roughly'] : [w])).join(' ');
          };

          const ATTACKS = [
            { marg: 'The index',
              lead: 'What we are protecting is one question we intend to grade the model on. The gate hashes it into every ',
              bold: 'thirteen-word window', tail: ' it contains and keeps only those. The sentence itself never ships.',
              transform: null },
            { marg: 'Attack 1 · paste it',
              lead: 'Now it turns up inside an ordinary training shard, copied exactly. Every window matches, so ',
              bold: 'the shard is dropped', tail: ' and the gate names what it collided with.',
              transform: (q) => q },
            { marg: 'Attack 2 · shout it',
              lead: 'Uppercase it, strip the punctuation, wrap it in quotation marks. The index compares ',
              bold: 'lowercased word tokens', tail: ', so none of that is visible to it. Nothing changes.',
              transform: (q) => `“${q.toUpperCase().replace(/[?,.;:]/g, '')}!”` },
            { marg: 'Attack 3 · reflow it',
              lead: 'Break it across lines, double the spaces, indent it like a pull quote. Whitespace is not a token either, so ',
              bold: 'the window count is identical', tail: '.',
              transform: (q) => q.split(/\s+/).map((w, i) => ((i + 1) % 6 === 0 ? `${w}\n   ` : w)).join(' ') },
            { marg: 'Attack 4 · add a word',
              lead: 'Slip one word into the middle. That destroys ',
              bold: 'every window spanning it', tail: ' — and the windows either side survive, which is enough. Still dropped.',
              transform: (q) => wedge(q, Infinity) },
            { marg: 'Attack 5 · add one every twelve',
              lead: 'Do it again every twelve words and no run of thirteen survives intact. ',
              bold: 'Nothing is dropped', tail: '. The question is still plainly the same question, and the gate cannot see it. That is the boundary of the method, not a defect in this implementation of it.',
              transform: (q) => wedge(q, N - 1) },
          ];

          /* ---- the pinned figure ---- */
          const big = $('div', 'fig-big');
          const gsub = $('div', 'fig-sub');
          const verdict = $('div', 'fig-verdict');
          const strip = $('div', 'strip');
          const gnote = $('div', 'fig-note');
          const fig = $('div', 'fig');
          fig.append($('div', 'fig-num', 'Fig. 1 — the gate, against your sentence'), big, gsub, verdict, strip, gnote);

          const rail = $('div', 'fig-rail');
          rail.append(
            document.createTextNode('The live index holds '),
            renderNumber(data.contamination.shingle_count),
            document.createTextNode(' and covers '),
            $('b', '', data.contamination.coverage),
            document.createTextNode(' of the '),
            renderNumber({
              value: data.record_counts.benchmarks,
              unit: 'benchmarks',
              provenance: data.record_counts.provenance,
              source: data.record_counts.source,
            }),
            document.createTextNode(' registered by name. What you defeated above is the mechanism, run against your own sentence — not a certificate that the corpus is clean.'),
          );

          const gsticky = $('div', 'sticky');
          gsticky.append(fig, rail, $('div', 'pill', '13 words = a fingerprint'));

          /* ---- the prose steps ---- */
          const question = $('textarea', 'qinput');
          question.rows = 3;
          question.id = 'gate-q';
          question.value = DEFAULT_Q;
          question.spellcheck = false;

          const qbox = $('div', 'qbox');
          const qlabel = $('label', '', 'The question we are protecting — replace it with one of your own');
          qlabel.htmlFor = 'gate-q';
          qbox.append(qlabel, question);

          const stepEls = ATTACKS.map((a, i) => {
            const el = $('div', 'step');
            el.tabIndex = 0;
            el.dataset.i = String(i);
            const p = $('p');
            p.append(document.createTextNode(a.lead), $('b', '', a.bold), document.createTextNode(a.tail));
            el.append($('div', 'marg', a.marg), p);
            el.append($('div', 'shard'), $('div', 'inline'));
            el.addEventListener('focus', () => show(i));
            return el;
          });

          const steps = $('div', 'steps');
          steps.append(...stepEls);

          /* ---- state ---- */
          let registry = new Set();
          let current = 0;

          /* A question the index cannot hold has no verdict to give, and saying "nothing dropped"
           * would read as a successful attack. Under 13 words `shingle()` emits a single
           * whole-text gram, which can never match a 13-gram drawn from a longer shard — so a
           * short item is undetectable once embedded. That is the pipeline's behaviour, not this
           * page's: see the note under Fig. 1. */
          const guard = () => {
            const n = words(question.value).length;
            if (!n) return { verdict: 'NOTHING TO PROTECT', note: 'With no question in the index there is nothing for a shard to collide with.', inline: '→ no question registered' };
            if (n < N) return {
              verdict: 'NOT INDEXABLE',
              note: `A question of ${n} words is shorter than the 13-word window, so it hashes to a single whole-text gram that cannot match inside a longer shard. Short items are undetectable — give it 13 words or more.`,
              inline: `→ ${n} words; needs ${N}`,
            };
            return null;
          };

          /* `marks` is one flag per window of the shard, in order, so the strip shows *where* the
           * collisions are — clustered where the question sits, never in the surrounding text. */
          const stateFor = (i) => {
            const a = ATTACKS[i];
            if (!a.transform) return { text: null, marks: registry.size ? Array(registry.size).fill(false) : [], hits: registry.size };
            const text = a.transform(question.value);
            const marks = windows(LEAD + text + TAIL).map((x) => registry.has(x));
            return { text, marks, hits: marks.filter(Boolean).length };
          };

          const show = (i) => {
            current = i;
            stepEls.forEach((el, k) => el.classList.toggle('on', k === i));
            const short = guard();
            if (short) {
              big.replaceChildren(renderNumber(
                { value: null, unit: 'windows', provenance: 'unknown', source: 'question is shorter than the 13-word window' },
                { unit: false },
              ));
              big.classList.remove('hit');
              gsub.textContent = 'no verdict is available for this question';
              verdict.textContent = short.verdict;
              verdict.classList.remove('hit');
              gnote.textContent = short.note;
              strip.replaceChildren();
              return;
            }
            const st = stateFor(i);
            const caught = Boolean(ATTACKS[i].transform) && st.hits > 0;

            big.replaceChildren(renderNumber(
              { value: st.hits, unit: 'windows', provenance: 'measured', source: 'computed in your browser' },
              { unit: false },
            ));
            big.classList.toggle('hit', caught);
            gsub.textContent = ATTACKS[i].transform
              ? `of the shard's ${st.marks.length} thirteen-word windows match the index`
              : 'thirteen-word windows taken from your question';
            verdict.textContent = ATTACKS[i].transform
              ? (caught ? 'SHARD DROPPED' : 'NOTHING DROPPED')
              : 'REGISTERED';
            verdict.classList.toggle('hit', caught);
            gnote.textContent = ATTACKS[i].transform
              ? (caught
                ? 'Named source: your question. One matching window is already enough — thirteen consecutive words agreeing by chance is not a thing that happens.'
                : 'No red anywhere is the alarm. The gate removes nothing, so this shard would be trained on.')
              : 'Red marks what the gate removes. Here it removes nothing yet.';

            strip.replaceChildren();
            st.marks.slice(0, 44).forEach((matched) => {
              const t = $('div', 'fig-tick');
              if (!ATTACKS[i].transform) t.classList.add('reg');
              else if (matched) t.classList.add('hit');
              strip.append(t);
            });
          };

          const recompute = () => {
            registry = new Set(windows(question.value));
            const short = guard();
            stepEls.forEach((el, i) => {
              const st = stateFor(i);
              const caught = !short && Boolean(ATTACKS[i].transform) && st.hits > 0;
              el.querySelector('.shard').textContent = st.text === null
                ? `${registry.size} windows registered`
                : `…${LEAD.trim()} ${st.text} ${TAIL.trim()}`;
              const inl = el.querySelector('.inline');
              if (short) inl.textContent = short.inline;
              else inl.textContent = ATTACKS[i].transform
                ? `→ ${st.hits} of ${st.marks.length} windows match — ${caught ? 'SHARD DROPPED' : 'NOTHING DROPPED'}`
                : `→ ${registry.size} windows registered`;
              inl.style.color = caught ? 'var(--grade-x)' : 'var(--muted)';
            });
            show(current);
          };
          question.addEventListener('input', recompute);

          /* Scroll position is the control, so there is no control row to operate (§18.2). Tab
           * through the steps does the same job for anyone not using a pointer. */
          if ('IntersectionObserver' in window) {
            const io = new IntersectionObserver(
              (entries) => entries.forEach((e) => { if (e.isIntersecting) show(Number(e.target.dataset.i)); }),
              { rootMargin: '-45% 0px -45% 0px' },
            );
            stepEls.forEach((el) => io.observe(el));
          }

          const s = $('section', 'gate');
          s.id = 's1';
          const h = $('h2');
          h.append($('span', 'n', '1'), document.createTextNode('Thirteen words in a row is a fingerprint'));
          const claim = $('p', 'claim');
          claim.append(
            document.createTextNode('Everything else here argues about proportions. This one is a hard stop: if training text overlaps the evaluation set, every score afterwards is fiction. Below is the check itself, and it is worth trying to beat — '),
            $('b', '', 'the sentence is yours to change'),
            document.createTextNode(', and scrolling attacks it. Watch how far '),
            $('b', '', 'cosmetic edits'),
            document.createTextNode(' get, and where they stop. Coverage today is limited by what eval items we hold — see '),
            ref('the instruments', 'benchmarks'), document.createTextNode('.'),
          );
          const body = $('div', 'scrolly');
          body.append(qbox, steps, gsticky);
          const figure = $('figure');
          figure.append(body, $('figcaption', '', 'Fig. 1 — 13-word shingles, the algorithm in dataframework/shingles.py, run live on the text above. The pipeline stores each window as a truncated blake2b digest because that index ships publicly; nothing here leaves your browser, so the windows are compared as text.'));
          s.append(h, claim, figure);
          main.append(s);

          recompute();
          playAll.push(() => show(ATTACKS.length - 1));
        }

        /* ---------------------------------------------------- 2 · Vocab crossing (Optimizer)
         *
         * The sweep is ported from dataframework/vocab_sweep.py and verified against it: peak
         * vocabulary at d_model 2048/4096/6144/8192 comes out 64K/96K/136K/176K in both. Porting
         * rather than reading the shipped curve is what makes the width a live input — data.json
         * carries one curve, at one width, and the argument is that the answer moves.
         *
         * The two component curves are drawn, not just the net. The peak is where the GAP between
         * them is widest, which is a thing you can see; they never cross, and saying they do would
         * be a nicer sentence about a different chart.
         */
        {
          const sw = data.vocab_sweep;
          const V_MIN = 64_000, V_MAX = 320_000, V_STEP = 8_000;
          const LAYERS = 48;            // vocab_sweep.DEFAULT_LAYERS
          const REF_V = 100_000, REF_F = 2.4;  // export.REFERENCE_VOCAB / REFERENCE_FERTILITY

          const softmaxCost = (V, d) => (2 * d * V) / (2 * d * V + 12 * d * d * LAYERS);
          const fertilityAt = (V) => {
            const scale = Math.log(V / REF_V) / Math.log(2);
            return Math.max(1, 1 + Math.max(REF_F - 1, 0) * 0.92 ** scale);
          };
          const sweep = (d) => {
            const baseF = fertilityAt(V_MIN), baseC = softmaxCost(V_MIN, d);
            const out = [];
            for (let V = V_MIN; V <= V_MAX; V += V_STEP) {
              const saving = (baseF - fertilityAt(V)) / baseF;
              const extra = softmaxCost(V, d) - baseC;
              out.push({ V, saving, extra, net: saving - extra });
            }
            return out;
          };
          const peakOf = (c) => c.reduce((a, b) => (b.net > a.net ? b : a));

          const WIDTHS = [2048, 4096, 6144, 8192];
          const TARGET = sw.d_model.value;   // 6144, the confirmed 40B width

          const STATES = [
            { d: WIDTHS[0], marg: 'Narrow · 2,048',
              lead: 'On a narrow model the vocabulary projection is a large share of every forward pass, so ',
              bold: 'the optimum falls off the bottom of the range', tail: ' we swept. The answer is not "64,000" — it is "smaller than we looked".' },
            { d: WIDTHS[1], marg: 'Wider · 4,096',
              lead: 'Double the width and the body of the network dwarfs the projection, so ',
              bold: 'a bigger vocabulary starts paying', tail: '. The peak moves right, and it moves a long way.' },
            { d: TARGET, marg: 'The 40B target · 6,144',
              lead: 'At the width this project has actually settled on, the widest gap between saving and cost sits here. This is ',
              bold: 'the number the sweep recommends', tail: ' — and it is not the number the project uses.' },
            { d: WIDTHS[3], marg: 'Wide · 8,192',
              lead: 'Wider still and the vocabulary is almost free: the projection barely registers against the body, so ',
              bold: 'the peak keeps sliding right', tail: '. Vocabulary size is a consequence of width, not an independent choice.' },
            { d: TARGET, band: true, marg: 'How shallow',
              lead: 'Back at the target width, the region within a tenth of the best net benefit is ',
              bold: 'tens of thousands of slots wide', tail: '. Being well inside the region beats being exactly on the peak of a curve this soft.' },
            { d: TARGET, anchor: true, marg: 'What holds it up',
              lead: 'All of it rests on one fertility measurement that ',
              bold: 'has never been taken', tail: '. Move that anchor and every peak above moves with it. The shape of the trade-off is real; the position of the answer is not yet.' },
          ];

          const W = 384, H = 168, PAD_L = 6, PAD_R = 6, PAD_T = 14, PAD_B = 20;
          const draw = (state) => {
            const curve = sweep(state.d);
            const peak = peakOf(curve);
            const hi = Math.max(...curve.map((c) => Math.max(c.saving, c.extra)));
            const x = (i) => PAD_L + (i / (curve.length - 1)) * (W - PAD_L - PAD_R);
            const y = (v) => H - PAD_B - (v / (hi || 1)) * (H - PAD_T - PAD_B);
            const line = (key, stroke, dash) => svgEl('path', {
              fill: 'none', stroke, 'stroke-width': 2, ...(dash ? { 'stroke-dasharray': dash } : {}),
              d: curve.map((c, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(c[key]).toFixed(1)}`).join(' '),
            });
            const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' });
            const title = svgEl('title');
            title.textContent = `Token saving and added softmax cost against vocabulary size at d_model ${state.d}.`;
            svg.append(title);

            // The gap between the two curves IS the net benefit — shade it rather than assert it.
            const peakI = curve.indexOf(peak);
            svg.append(svgEl('path', {
              fill: 'var(--accent-soft)', stroke: 'none',
              d: `M${x(0)},${y(curve[0].saving)} ` +
                 curve.map((c, i) => `L${x(i).toFixed(1)},${y(c.saving).toFixed(1)}`).join(' ') + ' ' +
                 curve.slice().reverse().map((c, k) => `L${x(curve.length - 1 - k).toFixed(1)},${y(c.extra).toFixed(1)}`).join(' ') + ' Z',
            }));
            svg.append(line('extra', 'var(--faint)', '4 3'), line('saving', 'var(--accent)'));
            svg.append(svgEl('line', {
              x1: x(peakI), x2: x(peakI), y1: y(peak.saving), y2: y(peak.extra),
              stroke: 'var(--ink)', 'stroke-width': 1.5,
            }));
            const cap = svgEl('text', {
              x: Math.min(x(peakI) + 6, W - 96), y: PAD_T + 4, 'font-size': 11,
              fill: 'var(--ink)', 'font-family': 'var(--mono)', 'data-provenance': 'estimated',
            });
            cap.textContent = `widest gap · ${fmt(peak.V, 'count')}`;
            svg.append(cap);
            const axis = svgEl('text', { x: PAD_L, y: H - 4, 'font-size': 10, fill: 'var(--faint)', 'font-family': 'var(--mono)', 'data-provenance': 'estimated' });
            axis.textContent = `${fmt(V_MIN, 'count')} → ${fmt(V_MAX, 'count')} vocabulary · saving (solid) vs added cost (dashed)`;
            svg.append(axis);
            return { svg, curve, peak };
          };

          main.append(buildExplainer({
            n: 2, wide: true,
            title: 'The vocabulary is a consequence of the width',
            claim: [
              document.createTextNode('Two costs pull against each other. A bigger vocabulary means fewer tokens per word, which is a saving on every token of the whole run; but the output projection grows with it, taxing every forward pass. The best size is where the gap between them is widest — and that gap moves with '),
              $('b', '', 'how wide the model is'),
              document.createTextNode('. Scrolling changes the width. The curve is '),
              $('b', '', 'not yet anchored on a measurement'),
              document.createTextNode(' — see '), ref('the tokenizer tax', 'fertility'), document.createTextNode('.'),
            ],
            figNum: 'Fig. 2 — where the gap is widest',
            caption: 'Fig. 2 — Token saving and added softmax cost against vocabulary, swept live from vocab_sweep.py’s model at the width each step names. The shaded gap is the net benefit; the peak is where it is widest. The two curves do not cross — the optimum is a widest gap, not a crossing.',
            states: STATES,
            pill: 'the peak moves with d_model',
            rail: [
              document.createTextNode('Every figure here is '),
              $('b', '', 'estimated'),
              document.createTextNode(', not measured: the fertility model has no anchor until task 2.2b runs. The project’s settled vocabulary is '),
              renderNumber({ value: 208_896, unit: 'tokens', provenance: 'estimated', source: 'docs/DECISIONS.md' }),
              document.createTextNode(', which this sweep does not reproduce at any width it covers — the sweep informs the decision, it did not make it.'),
            ],
            refresh: (api) => {
              STATES.forEach((st, i) => {
                const { curve, peak } = draw(st);
                const near = curve.filter((c) => c.net >= peak.net * 0.9).length;
                api.shard(i, `d_model ${st.d} · ${LAYERS} layers · V ${fmt(V_MIN, 'count')}–${fmt(V_MAX, 'count')}`);
                api.inline(i, st.anchor
                  ? '→ anchor unmeasured; the position of every peak above is provisional'
                  : `→ widest gap at ${fmt(peak.V, 'count')}${st.band ? `, and ${near} of ${curve.length} candidates land within a tenth of it` : ''}`,
                  Boolean(st.anchor) || peak.V === V_MIN);
              });
            },
            render: (i, api) => {
              const st = STATES[i];
              const { svg, curve, peak } = draw(st);
              const offEdge = peak.V === V_MIN;
              api.extra.replaceChildren(svg);
              api.big({ value: peak.V, unit: 'tokens', provenance: 'estimated', source: 'computed:vocab_sweep' });
              api.bigHit(offEdge);
              api.sub(`vocabulary at the widest gap, d_model ${st.d}`);
              api.verdict(offEdge ? 'OUTSIDE THE SWEEP' : (st.anchor ? 'UNANCHORED' : 'BEST IN RANGE'), offEdge);
              api.note(st.anchor
                ? 'The shape of this trade-off is sound. Its position is a projection from a fertility number nobody has measured yet.'
                : offEdge
                  ? 'Red marks a candidate the sweep cannot price: the optimum is below the smallest vocabulary we considered.'
                  : st.band
                    ? `${curve.filter((c) => c.net >= peak.net * 0.9).length} of ${curve.length} candidates sit within a tenth of the best. The optimum is a region, not a point.`
                    : 'The peak is where the shaded gap is widest — where one more slot stops paying for itself.');
              const near = st.band ? curve.map((c) => (c.net >= peak.net * 0.9 ? 'reg' : '')) : null;
              api.strip(curve.map((c, k) => {
                if (offEdge && k === 0) return 'hit';
                if (near) return near[k];
                return c.V === peak.V ? 'reg' : '';
              }));
            },
          }));
        }

        /* ---------------------------------------------------- 3 · The Tax
         *
         * Two columns, deliberately: what a published paper measured, and what we have measured
         * ourselves (nothing). Citing someone else's measurement is not the same as estimating our
         * own — the first is evidence with a name on it, the second is the thing ground rule 8
         * forbids. Keeping them side by side is what makes the distinction legible.
         */
        {
          const f = data.fertility.by_language;
          const unknownCount = Object.values(f).filter((v) => v.value === null).length;
          const tax = (data.priors || []).find((p) => /tokenization tax/i.test(p.claim || ''));

          /* A chart, not an explainer, and deliberately (EXPLAINER_PROMPT §9). The interaction that
           * would prove this claim is switching tokenizer and watching 22 languages move — and we
           * hold no per-language fertility for any tokenizer. Building the control anyway would
           * mean inventing the numbers it moved. It becomes the flagship explainer when 2.2b runs;
           * until then the honest form is two columns, one of which is empty. */
          const row = (k, v, cls) => {
            const r = $('div', 'figrow');
            const val = $('div', `v ${cls || ''}`);
            if (v instanceof Node) val.append(v); else val.textContent = v;
            r.append($('div', 'k', k), val);
            return r;
          };

          const cmp = $('div', 'compare');

          const theirs = $('div');
          theirs.append($('div', 'lbl', 'measured — by someone else, published'));
          theirs.append(
            row('average Indic tax vs English', '8.0×', 'bad'),
            row('worst language · Malayalam', '13.0×', 'bad'),
            row('context left vs an English user', '12%', 'bad'),
            row('a better tokenizer cuts it by', '73%'));
          const src = $('p', 'fig-note');
          src.append(document.createTextNode('FLORES-200, six tokenizers, fourteen Indian languages. Failed byte-pair merges are the mechanism — merge failure tracks the tax at r = 0.89. Source: '),
            $('b', '', (tax && tax.source) || 'the priors'), document.createTextNode('.'));
          theirs.append(src);

          const fert = data.fertility;
          const measured = Object.entries(f).filter(([, v]) => v.value !== null);
          const english = (f.en || {}).value;
          const worst = measured.filter(([c]) => c !== 'en').sort((a, b) => b[1].value - a[1].value)[0];
          const meanTax = english
            ? measured.filter(([c]) => c !== 'en').reduce((a, [, v]) => a + v.value / english, 0) / (measured.length - 1)
            : null;

          const ours = $('div');
          ours.append($('div', 'lbl', 'measured — by us, partially'));
          ours.append(
            row('average Indic tax vs English', meanTax ? `${meanTax.toFixed(1)}×` : '—', 'bad'),
            row(`worst language · ${worst ? worst[0] : '—'}`, worst && english ? `${(worst[1].value / english).toFixed(1)}×` : '—', 'bad'),
            row('a better tokenizer cuts it by', '78%'),
            row('languages covered', `${measured.length - 1} of ${Object.keys(f).length - 1}`));
          const why = $('p', 'fig-note');
          why.append(
            document.createTextNode('Our own run, three ungated tokenizers over '),
            $('b', '', fert.corpus || 'FLORES-200'),
            document.createTextNode(' — which is the protocol’s secondary corpus and translated from English, so these carry the same translationese caveat as the column beside them. They corroborate it independently rather than repeating it. What is still missing is the row that matters most: '),
            $('b', '', 'our own candidate vocabulary has never been trained'),
            document.createTextNode(', so no parity ratio against the '),
            renderNumber(data.fertility.parity_target),
            document.createTextNode(' × target can be computed, and section 2’s curve stays unanchored. Three languages are absent from FLORES entirely.'));
          ours.append(why);

          cmp.append(theirs, ours);
          main.append(sect(3, 'The tax is charged before the first training step',
            [document.createTextNode('A tokenizer built for English splits Indian scripts into far more pieces than it splits English, and every extra piece is paid for on '),
             $('b', '', 'every step of the entire run'),
             document.createTextNode('. The multiplier outweighs almost any decision about corpus size, and unlike data you cannot fix it afterwards. It is not a property of the scripts — other tokenizers already do far better on the same sentences — which is why it is worth measuring rather than accepting.')],
            cmp,
            `Fig. 3 — Measured by us on ${data.fertility.corpus || 'FLORES-200'} under run ${(data.fertility.run_id || '').slice(0, 24)}; ${unknownCount} of ${Object.keys(f).length} languages have no measurement. Still a chart rather than an explainer: three of the protocol's six tokenizers are unavailable, and the one under test does not exist yet.`));
        }

        /* ---------------------------------------------------- 4 · The Filter (Destroyer)
         *
         * Audit row #5, and the one the audit said buys the most: the rescue toggle was missing,
         * so the old version showed languages dying and stopped there. Watching them come back is
         * the entire argument for the protected lane, and it is one state away.
         *
         * Carries the page's predict-before-reveal (EXPLAINER_PROMPT §14.1). Readers guess high on
         * this one, and the gap between the guess and 10 is the lesson. The guess is pinned beside
         * the answer rather than replaced by it.
         */
        {
          const langs = (records.languages || []).slice();
          const TOTAL = langs.length;
          const lane = data.mix_rules.always_on_share;
          const tiersOf = (max) => langs.filter((l) => (l.tier || 3) <= max);

          const STATES = [
            { keep: 3, marg: 'Before the filter',
              lead: 'Every language the project has scheduled is present, which is the only moment in this section when that is true. Tier 3 here is not a judgement about the languages — it is ',
              bold: 'a statement about how much text exists', tail: '.' },
            { keep: 2, marg: 'The filter runs',
              lead: 'A quality classifier trained on English proxies scores thin-resource text as noise, so the languages with least data go first. Nothing has malfunctioned: this is ',
              bold: 'the filter working as designed', tail: ', on the wrong objective.' },
            { keep: 1, marg: 'Turn it up',
              lead: 'Raise the threshold the way anyone chasing a cleaner corpus would, and the losses reach the languages with real corpora behind them. What survives is ',
              bold: 'the set that needed no help', tail: '.' },
            { keep: 1, rescue: true, marg: 'The lane',
              lead: 'Now reserve a fixed share of every batch that no selector is allowed to touch. The threshold has not moved and the classifier still scores the same way, but ',
              bold: 'every language is back', tail: '.' },
            { keep: 1, rescue: true, cost: true, marg: 'What it costs',
              lead: 'The whole rescue is a standing charge on the batch, decided once and never renegotiated per language. It is ',
              bold: 'cheap enough to be uninteresting', tail: ' — which is the argument for doing it rather than optimising it.' },
          ];

          const guessOf = (api) => {
            const n = parseInt(String(api.input && api.input.value).replace(/[^\d]/g, ''), 10);
            return Number.isFinite(n) && n >= 0 && n <= TOTAL ? n : null;
          };

          main.append(buildExplainer({
            n: 4,
            title: 'The filter deletes exactly the languages the model exists to serve',
            claim: [
              document.createTextNode('Quality classifiers are trained on English proxies, so they read thin-resource languages as noise. Raising the threshold is the obvious move and it is the wrong one — the languages with least data disappear first. Before scrolling, put a number in the box: '),
              $('b', '', 'how many of the 22 survive'),
              document.createTextNode(' a filter turned up hard? Then scroll, and watch what brings them back. Details in '),
              ref('the languages', 'languages'), document.createTextNode('.'),
            ],
            figNum: 'Fig. 4 — what survives',
            caption: 'Fig. 4 — One mark per scheduled language, ordered by tier. Red is a language the filter removes. The rescue state changes no threshold and no classifier — it reserves a share of the batch that the selector may not touch.',
            input: { rows: 1, label: `Before you scroll — how many of the ${TOTAL} survive a hard filter?`, value: '' },
            pill: '8% of every batch',
            rail: [
              document.createTextNode('The lane is '),
              renderNumber(lane),
              document.createTextNode(' of every batch, fixed in FRAMEWORK.md R2 rather than tuned per language — a per-language exception list is a thing somebody eventually edits under deadline. Tier assignments come from available corpus size, not from any judgement about the languages themselves.'),
            ],
            states: STATES,
            refresh: (api) => {
              STATES.forEach((st, i) => {
                const alive = st.rescue ? TOTAL : tiersOf(st.keep).length;
                api.shard(i, langs.filter((l) => !(st.rescue || (l.tier || 3) <= st.keep))
                  .map((l) => l.name || l.code).join(' · ') || 'nothing removed');
                api.inline(i, `→ ${alive} of ${TOTAL} survive${st.rescue ? ' (lane on)' : ''}`, alive < TOTAL);
              });
            },
            render: (i, api) => {
              const st = STATES[i];
              const survivors = st.rescue ? langs : tiersOf(st.keep);
              const lost = TOTAL - survivors.length;
              const guess = guessOf(api);

              api.big({ value: survivors.length, unit: 'languages', provenance: 'measured', source: 'computed from the language register' });
              api.bigHit(lost > 0);
              api.sub(st.rescue ? `of ${TOTAL} present — the lane restores every one` : `of ${TOTAL} survive the threshold`);
              api.verdict(st.rescue ? 'LANE ON' : (lost ? `${lost} DELETED` : 'UNFILTERED'), lost > 0);

              if (st.cost) {
                api.note(`The lane costs ${(lane.value * 100).toFixed(0)}% of every batch and returns ${TOTAL - tiersOf(1).length} languages that a threshold alone would have removed. That is the entire trade.`);
              } else if (st.rescue) {
                api.note('No red anywhere. Nothing about the filter changed — the batch simply has a floor the filter cannot reach below.');
              } else if (lost && guess !== null) {
                const dir = guess > survivors.length ? 'high' : guess < survivors.length ? 'low' : 'exactly right';
                api.note(dir === 'exactly right'
                  ? `You guessed ${guess}, which is exactly right — most people guess high.`
                  : `You guessed ${guess}; ${survivors.length} survive. You were ${Math.abs(guess - survivors.length)} too ${dir}.`);
              } else if (lost) {
                api.note(`${lost} languages removed. The filter never sees a language — it sees documents that score badly, and thin-resource text always does.`);
              } else {
                api.note('Red marks a language the filter removes. Here it removes none, because nothing has run yet.');
              }

              api.strip(langs.map((l) => (st.rescue ? 'reg' : ((l.tier || 3) <= st.keep ? '' : 'hit'))));
            },
          }));
        }

        /* ---------------------------------------------------- 5 · The mix (Budget)
         *
         * Audit row #6. Was a rung control plus a click-to-open detail panel — one tier visible at
         * a time, which EXPLAINER_PROMPT §18 calls a failure of layout dressed as a feature. All
         * eight tiers fit on screen at once, so the selector is deleted and comparison is free.
         *
         * Family is Budget: the mixture is zero-sum. Scrolling walks the four rungs and then the
         * two groupings that decide the argument — what a quality selector can see, and how much
         * of the Indic share is manufactured rather than collected.
         *
         * Absorbs /reasoning#gaps, whose single row (no Indic-commented code corpus exists) is the
         * red rail this section needed and did not have.
         */
        {
          const info = data.milestones.tier_info || {};
          const presets = data.milestones.presets;
          const TIERS = presets[0].mix.tiers.map((t) => t.name);
          /* The red rail, taken from the catalogue rather than named by hand: a tier is marked
           * when a dataset flagged is_gap sits in its category. Today that is COD-03,
           * Indic-commented code — scheduled, and no corpus exists in any licence at any size. */
          const GAPS = (data.datasets || []).filter((x) => x.is_gap);
          const gapTiers = new Set(GAPS.map((x) => String(x.category || '').split(' ')[0].toLowerCase()));
          const gapNames = GAPS.map((x) => x.name).join(', ');

          const STATES = [
            ...presets.map((p, k) => ({
              rung: k, marg: `Budget · ${p.id}`,
              lead: k === 0
                ? 'This is the rung buildable from open sources today. Eight tiers, each with a reason to exist, and every share here is '
                : `At ${p.id} the same shape scales, and the constraint does not move: every share is still `,
              bold: 'taken from the others',
              tail: k === 0
                ? '. There is no spare capacity in a training budget — a point added to one tier is a point removed from another.'
                : '. Collecting more English does not create room for Indic; it spends it.',
            })),
            { rung: 2, lane: true, marg: 'What the filter may touch',
              lead: 'Group the same tiers by whether the quality selector is allowed to score them. The tiers in the protected lane are there because an English-tuned filter reads them as noise, so they are ',
              bold: 'exempted rather than defended', tail: ' — a filter you have to argue with every batch is a filter that eventually wins.' },
            { rung: 2, synth: true, marg: 'How much is manufactured',
              lead: 'Now split the Indic share by where it came from. Most of it is generated rather than collected, which is the fact the whole corpus architecture exists to work around: ',
              bold: 'synthetic text cannot teach what the languages know', tail: ', only how they are shaped.' },
          ];

          const barFor = (t, total, cls) => {
            const row = $('div', 'tierrow');
            const track = $('div', 'tiertrack');
            const fill = $('div', `tierfill ${cls}`);
            fill.style.width = `${(t.seen_tokens / total) * 100}%`;
            track.append(fill);
            const val = $('div', 'tierval');
            val.append(renderNumber({ value: t.seen_tokens, unit: 'tokens', provenance: 'estimated', source: 'computed:milestones' }, { unit: false }));
            row.append($('div', 'tiername', t.name), track, val);
            return row;
          };

          main.append(buildExplainer({
            n: 5, wide: true,
            title: 'The mixture is zero-sum, and a third of it is hidden from the filter',
            claim: [
              document.createTextNode('The corpus proposed for the run: eight tiers, all of them visible at once because comparing them is the point. Scrolling scales the budget and then regroups the same tiers twice — by '),
              $('b', '', 'what the quality filter may score'),
              document.createTextNode(', and by '),
              $('b', '', 'how much of the Indic share is manufactured'),
              document.createTextNode('. Per-tier reasoning in '),
              ref('the catalogue', 'data'), document.createTextNode('.'),
            ],
            figNum: 'Fig. 5 — the mixture',
            caption: 'Fig. 5 — All eight tiers at every state; no tier is ever hidden. Bar length is seen tokens as a share of the budget. Red marks the tier that has no corpus behind it — the capability is scheduled and the data does not exist.',
            pill: '8% never filtered',
            rail: [
              document.createTextNode('One tier is scheduled against data that does not exist. '),
              $('b', '', gapNames),
              document.createTextNode(' has no corpus behind it in any licence at any size, and it stays in the mixture as a stated gap rather than being quietly dropped — removing it would make the plan look complete when it is not.'),
            ],
            states: STATES,
            refresh: (api) => {
              STATES.forEach((st, i) => {
                const mix = presets[st.rung].mix;
                if (st.lane) {
                  const on = mix.tiers.filter((t) => (info[t.name] || {}).always_on);
                  api.shard(i, `protected: ${on.map((t) => t.name).join(' · ')}`);
                  api.inline(i, `→ ${(mix.always_on_share * 100).toFixed(0)}% of the batch bypasses the selector`, false);
                } else if (st.synth) {
                  api.shard(i, `Indic ${(mix.indic_share * 100).toFixed(1)}% of the batch · natural ${(mix.natural_indic_share * 100).toFixed(1)}% of that`);
                  api.inline(i, `→ ${(mix.synthetic_share_of_indic * 100).toFixed(0)}% of the Indic share is manufactured`, true);
                } else {
                  api.shard(i, mix.tiers.map((t) => `${t.name} ${(t.share * 100).toFixed(0)}%`).join(' · '));
                  api.inline(i, `→ ${fmt(mix.total_seen_tokens, 'count')} seen from ${fmt(mix.total_unique_tokens, 'count')} unique`, false);
                }
              });
            },
            render: (i, api) => {
              const st = STATES[i];
              const mix = presets[st.rung].mix;
              const total = mix.total_seen_tokens;
              const bars = $('div', 'tierbars');
              mix.tiers.forEach((t) => {
                const meta = info[t.name] || {};
                // Red is only ever the excluded thing: the tier with no corpus behind it.
                const missing = gapTiers.has(t.name);
                let cls = '';
                if (st.lane) cls = meta.always_on ? 'lane' : 'dim';
                else if (st.synth) cls = meta.is_indic ? (meta.is_synthetic ? 'synth' : 'natural') : 'dim';
                if (missing) cls = 'missing';
                bars.append(barFor(t, total, cls));
              });
              api.extra.replaceChildren(bars);

              if (st.lane) {
                api.big(mix.always_on_share === undefined
                  ? data.mix_rules.always_on_share
                  : { value: mix.always_on_share, unit: 'share', provenance: 'estimated', source: 'computed:milestones' });
                api.sub('of every batch the selector may not score');
                api.verdict('PROTECTED LANE', false);
                api.note('The lane is a property of the batch, not a plea to the filter. Nothing here argues with the classifier — it simply cannot reach these tiers.');
              } else if (st.synth) {
                api.big({ value: mix.synthetic_share_of_indic, unit: 'share', provenance: 'estimated', source: 'computed:milestones' });
                api.sub('of the Indic share is manufactured, not collected');
                api.verdict('MOSTLY SYNTHETIC', true);
                api.note(`Natural Indic is ${(mix.natural_indic_share * 100).toFixed(1)}% of the whole batch. Every argument about Indic capability rests on that slice, not on the headline Indic share.`);
              } else {
                api.big({ value: mix.total_seen_tokens, unit: 'tokens', provenance: 'estimated', source: 'computed:milestones' });
                api.sub(`seen tokens across ${mix.tiers.length} tiers`);
                api.verdict(`${(mix.indic_share * 100).toFixed(0)}% INDIC`, false);
                api.note(`Read from ${fmt(mix.total_unique_tokens, 'count')} unique tokens. The difference between seen and unique is repetition, which section 10 prices.`);
              }
              api.strip(mix.tiers.map((t) => {
                const meta = info[t.name] || {};
                if (gapTiers.has(t.name)) return 'hit';
                if (st.lane) return meta.always_on ? 'reg' : '';
                if (st.synth) return meta.is_indic && !meta.is_synthetic ? 'reg' : '';
                return 'reg';
              }));
            },
          }));
        }

        /* ---------------------------------------------------- 6 · The Pipeline (Accumulator)
         *
         * Audit row #7. Absorbs /reasoning#tools, which held the same 17 records as a lookup table
         * — the detail this walk needs, so keeping both was keeping a duplicate.
         *
         * The reference Accumulator collapses a volume bar a millionfold across stages. We hold no
         * per-stage volumes, so the thing that compounds here is the decision count: seven stages,
         * seventeen tools, and the commitments pile up whether or not anyone revisits them.
         */
        {
          const tools = records.tools || [];
          const STAGES = [...new Set(tools.map((t) => t.stage))];
          const at = (i) => tools.filter((t) => t.stage === STAGES[i]);
          const upTo = (i) => tools.filter((t) => STAGES.indexOf(t.stage) <= i);

          const LEDE = {
            filtering: ['The first stage is the one with a tool worth adopting outright, purpose-built for Indian scripts. Everything downstream inherits ', 'whatever this stage lets through', '.'],
            lid: ['Language identification decides which pipeline a document even enters, so its errors are ', 'invisible rather than wrong', ' — a misrouted document is simply never seen again.'],
            extraction: ['Getting text out of a page is the stage everyone assumes is solved. It is solved for English layout; ', 'Indic layout is a different problem', '.'],
            ocr: ['Here the research reversed itself. The recommended system scored ', 'worst in class on real Devanagari scans', ', and the second candidate fails rarely but catastrophically. Both are marked avoid, in red.'],
            asr: ['Speech is where the largest untapped Indic corpus lives, and where the tooling is thinnest — this stage is mostly ', 'things you have to build', '.'],
            dedup: ['Deduplication is cheap to run and expensive to skip: two of the largest open corpora ship duplication their publishers ', 'did not remove', '.'],
            decontamination: ['The last stage is the gate from section 1. It is last in the pipeline and ', 'first in the build order', ', because a contaminated corpus invalidates every measurement taken after it.'],
          };

          const STATES = STAGES.map((st, i) => ({
            i, marg: `Stage ${i + 1} · ${st}`,
            lead: (LEDE[st] || ['This stage contributes ', 'its own decisions', ' to the pile.'])[0],
            bold: (LEDE[st] || ['', 'its own decisions', ''])[1],
            tail: (LEDE[st] || ['', '', '.'])[2],
          }));

          const chipFor = (t) => {
            const c = $('span', '', t.name);
            const colour = t.verdict === 'avoid' ? '--grade-x' : t.verdict === 'build' ? '--accent' : '--muted';
            c.style.cssText = `font-family:var(--mono);font-size:11px;margin:0 5px 5px 0;padding:1px 6px;border-radius:4px;` +
              `border:1px solid currentColor;display:inline-block;color:var(${colour})`;
            if (t.verdict === 'avoid') c.style.textDecoration = 'line-through';
            return c;
          };

          main.append(buildExplainer({
            n: 6,
            title: 'Seven stages, and the commitments do not un-make themselves',
            claim: [
              document.createTextNode('Between a URL and a training shard sit seven stages, each needing a tool you adopt, build, or avoid. Scrolling walks them, and the decisions '),
              $('b', '', 'accumulate'),
              document.createTextNode(' — by the last stage there are seventeen, two of them reversals of an earlier recommendation. Red is a tool this research decided against '),
              $('b', '', 'after measuring it'),
              document.createTextNode('. Full reasoning per tool in '),
              ref('the tools', 'tools'), document.createTextNode('.'),
            ],
            figNum: 'Fig. 6 — decisions committed',
            caption: 'Fig. 6 — One mark per tool in the register, filling as the pipeline is walked. Red marks a tool the research rejected on its own measurement, not on reputation. Stage names come from the tool register; there are seven, not the nine an earlier draft of this section claimed.',
            pill: '17 tools, 2 rejected',
            rail: [
              document.createTextNode('Verdicts are '),
              $('b', '', 'adopt, build or avoid'),
              document.createTextNode(' — there is no "evaluate later" band, because a stage with an undecided tool is a stage nobody can schedule. The two rejections are in OCR, and both came from running the systems on real Devanagari scans rather than from their published numbers.'),
            ],
            states: STATES,
            refresh: (api) => {
              STATES.forEach((st, i) => {
                const here = at(i);
                api.shard(i, here.map((t) => `${t.name} — ${t.verdict}`).join('\n'));
                const avoided = upTo(i).filter((t) => t.verdict === 'avoid').length;
                api.inline(i, `→ ${upTo(i).length} of ${tools.length} tools decided${avoided ? `, ${avoided} rejected` : ''}`, avoided > 0);
              });
            },
            render: (i, api) => {
              const here = at(i);
              const sofar = upTo(i);
              const rejected = sofar.filter((t) => t.verdict === 'avoid');
              const chips = $('div');
              here.forEach((t) => chips.append(chipFor(t)));
              api.extra.replaceChildren(chips);
              api.big({ value: sofar.length, unit: 'tools', provenance: 'measured', source: 'computed from the tool register' });
              api.bigHit(false);
              api.sub(`of ${tools.length} decided by the end of stage ${i + 1}`);
              api.verdict(rejected.length ? `${rejected.length} REJECTED` : 'ALL USABLE', rejected.length > 0);
              api.note(STAGES[i] === 'ocr'
                ? 'This is the reversal. Both rejections are in this stage, and both were made on measurement rather than on the systems’ published claims.'
                : rejected.length
                  ? `${rejected.length} tool(s) rejected so far. A rejection carries downstream: nothing later in the pipeline can rescue text this stage mangled.`
                  : 'Nothing rejected yet. Red appears the moment a tool is one this research decided against.');
              api.strip(tools.map((t) => {
                if (STAGES.indexOf(t.stage) > i) return '';
                return t.verdict === 'avoid' ? 'hit' : 'reg';
              }));
            },
          }));
        }

        /* ---------------------------------------------------- 7 · The Instruments (Destroyer)
         *
         * Audit row #8, re-framed from Inspector so it does not sit adjacent to another one. The
         * claim is not "capabilities differ" — it is that coverage is thinner than the raw count
         * suggests, because a translated benchmark is not evidence about Indic ability.
         *
         * Recomputed from data.coverage.capabilities[].benchmarks against each benchmark's
         * trust_band, so the collapse is measured rather than asserted.
         */
        {
          const caps = data.coverage.capabilities;
          const bandOf = new Map(data.benchmarks.map((b) => [b.name, b.trust_band]));
          const BANDS = [
            { keep: null, marg: 'Every instrument',
              lead: 'This is the register as it stands: every benchmark that can detect anything the model is built for. Counted this way, coverage looks ',
              bold: 'broadly adequate', tail: '.' },
            { keep: ['native-sourced', 'translation-derived'], marg: 'Drop harness-dependent',
              lead: 'Two of these produce a number that depends on which evaluation harness you ran, so the score is ',
              bold: 'not comparable between labs', tail: ' — including against the model you are trying to beat.' },
            { keep: ['native-sourced'], marg: 'Drop translated',
              lead: 'Four more were translated from English. A translated benchmark measures whether the model handles translated English, which is ',
              bold: 'not the thing being claimed', tail: '. What remains is evidence about Indic ability.' },
            { keep: ['native-sourced'], holes: true, marg: 'What is left uncovered',
              lead: 'Counting only native-sourced instruments, the capabilities with a single instrument or none are the ones where a regression could ship ',
              bold: 'without anybody noticing', tail: '.' },
          ];
          const countFor = (cap, keep) => (keep === null ? cap.benchmarks.length
            : cap.benchmarks.filter((n) => keep.includes(bandOf.get(n))).length);

          main.append(buildExplainer({
            n: 7,
            title: 'Most of the coverage is not evidence about Indic ability',
            claim: [
              document.createTextNode('Every capability the model is built for, against the benchmarks that can detect it. The raw count flatters the picture: scroll and remove the instruments whose scores '),
              $('b', '', 'do not mean what the count implies'),
              document.createTextNode(' — harness-dependent first, then translated-from-English — and watch how many capabilities are left with one instrument or none. Bands and split policies in '),
              ref('the instruments', 'benchmarks'), document.createTextNode('.'),
            ],
            figNum: 'Fig. 7 — capabilities you could grade',
            caption: 'Fig. 7 — One mark per capability. Red is a capability left with one instrument or none once the named band is removed. Trust bands are recorded per benchmark in the register; the counts here are recomputed from them, not restated.',
            pill: '25 of 31 native-sourced',
            rail: [
              document.createTextNode('A translated benchmark is not worthless — it is '),
              $('b', '', 'evidence about a different question'),
              document.createTextNode('. Reporting it beside native-sourced results without the distinction is how a model looks better at Indic than it is. The register keeps the band on every row so the two can never be silently summed.'),
            ],
            states: BANDS,
            refresh: (api) => {
              BANDS.forEach((b, i) => {
                const thin = caps.filter((c) => countFor(c, b.keep) <= 1);
                api.shard(i, thin.length ? thin.map((c) => `${c.capability} (${countFor(c, b.keep)})`).join(' · ') : 'every capability has two or more');
                api.inline(i, `→ ${thin.length} of ${caps.length} capabilities on one instrument or none`, thin.length > 0);
              });
            },
            render: (i, api) => {
              const b = BANDS[i];
              const counts = caps.map((c) => countFor(c, b.keep));
              const thin = counts.filter((n) => n <= 1).length;
              const gone = counts.filter((n) => n === 0).length;
              api.big({ value: caps.length - thin, unit: 'capabilities', provenance: 'measured', source: 'computed:coverage' });
              api.bigHit(thin > 0);
              api.sub(`of ${caps.length} still have more than one instrument`);
              api.verdict(gone ? `${gone} UNGRADABLE` : thin ? `${thin} ON ONE` : 'ALL COVERED', thin > 0);
              api.note(b.holes
                ? `${thin} capabilities sit on a single native-sourced instrument or none. A single instrument is not a measurement, it is a hostage.`
                : b.keep === null
                  ? 'Red marks a capability with one instrument or none. Counted this way there are few — which is the flattering version.'
                  : `Removing that band cost ${caps.reduce((a, c, k) => a + (c.benchmarks.length - counts[k]), 0)} benchmark slots across the capabilities.`);
              api.strip(counts.map((n) => (n <= 1 ? 'hit' : 'reg')));
            },
          }));
        }

        /* ---------------------------------------------------- 8 · Competitive frame */
        {
          const arch = (records.architectures || []).filter((a) => a.params_total);
          const mine = { model: 'this model', params_total: 40e9, params_active: 40e9, mine: true };
          const all = [...arch, mine];
          let mode = 'total';
          const host = $('div', 'axis');
          const ctr = $('div', 'controls');
          const draw = () => {
            host.replaceChildren();
            const vals = all.map((a) => (mode === 'active' ? a.params_active || a.params_total : a.params_total));
            const max = Math.max(...vals), min = Math.min(...vals);
            const pos = (v) => ((Math.log10(v) - Math.log10(min)) / (Math.log10(max) - Math.log10(min) || 1)) * 92 + 4;
            all.forEach((a, i) => {
              const v = vals[i];
              const dot = $('div', `dot${a.mine ? ' mine' : ''}`);
              dot.style.left = `${pos(v)}%`;
              dot.title = `${a.model} — ${fmt(v, 'count')}`;
              const t = $('div', 'tick', `${a.model.split(' ')[0]} ${fmt(v, 'count')}`);
              t.style.left = `${pos(v)}%`;
              t.style.top = i % 2 ? '26px' : '0px';
              host.append(dot, t);
            });
          };
          /* Inline topology (EXPLAINER_PROMPT §17). A chart, not an explainer — the claim is
           * carried by one sentence and needs no comparison the reader drives. But the one control
           * that earns its place lives *in* that sentence rather than in a row above the figure,
           * so there is no control bar to delete (§18.3). */
          const toggle = $('button', 'inlinectl', 'total');
          toggle.type = 'button';
          toggle.setAttribute('aria-live', 'polite');
          const sentence = $('p', 'claim');
          const tail = $('span');
          const retail = () => {
            tail.textContent = mode === 'total'
              ? ' parameters, every model here is counted at its full size — which is the number press releases use and the number that says least about what a forward pass costs.'
              : ' parameters, the sparse models move a long way left: a mixture-of-experts model the size of a building runs like a much smaller one, and that is the comparison a serving budget cares about.';
          };
          toggle.addEventListener('click', () => {
            mode = mode === 'total' ? 'active' : 'total';
            toggle.textContent = mode;
            retail();
            draw();
          });
          sentence.append(
            document.createTextNode('The comparison that matters is not the biggest model but the free one: a capable open-licensed model in this class means a from-scratch run has to justify itself against something anyone can download today. Measured by '),
            toggle, tail,
            document.createTextNode(' Architectures in '), ref('the evidence', 'papers'), document.createTextNode('.'),
          );
          retail();
          draw();

          const block = $('div', 'chartblock');
          block.append(host);
          const s8 = $('section');
          s8.id = 's8';
          const h8 = $('h2');
          h8.append($('span', 'n', '8'), document.createTextNode('The model to beat is the one that costs nothing'));
          const fig8 = $('figure');
          fig8.append(block, $('figcaption', '', 'Fig. 8 — Parameter counts on a log axis. This is a chart, not an explainer: the claim needs no comparison the reader has to perform, so the one control that earns its place sits in the sentence above rather than in a control bar.'));
          s8.append(h8, sentence, fig8);
          main.append(s8);
        }

        /* ---------------------------------------------------- 9 · Critical path */
        {
          const plan = records.plan || [];
          const maxWeek = Math.max(...plan.map((p) => p.week_end || p.week_start || 0), 12);
          const list = $('div', 'weeks');
          plan.forEach((p) => {
            const row = $('div', 'task');
            const lane = $('div', 'lane');
            const span = $('div', `span${p.is_gate ? ' gate' : ''}${(p.cost_inr === 0) ? ' free' : ''}`);
            const s = ((p.week_start || 1) - 1) / maxWeek * 100;
            const e = ((p.week_end || p.week_start || 1)) / maxWeek * 100;
            span.style.left = `${s}%`;
            span.style.width = `${Math.max(3, e - s)}%`;
            span.title = `${p.action}${p.is_gate ? ' — GATE' : ''}`;
            lane.append(span);
            row.append($('span', '', p.id), lane);
            list.append(row);
          });
          /* Margin-driven topology (EXPLAINER_PROMPT §17): the visual keeps the text column and its
           * labels move to a gutter. A chart, not an explainer — nothing the reader could do to
