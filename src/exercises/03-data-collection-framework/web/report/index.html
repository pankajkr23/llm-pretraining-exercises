           * this changes the argument, and §9 covers "when not to build one". */
          const gates = plan.filter((p) => p.is_gate);
          const free = plan.filter((p) => p.cost_inr === 0);
          const gutter = $('div', 'gutter');
          const gateNames = $('p');
          gateNames.style.cssText = 'margin:0 0 10px';
          gateNames.append($('b', '', `${gates.length} gates`),
            document.createTextNode(` — ${gates.map((p) => p.id).join(', ')}. Nothing downstream should start until these clear, because until the tokenizer is validated and the from-scratch question is settled at small scale, committing capital is guessing.`));
          const freeNote = $('p');
          freeNote.style.cssText = 'margin:0';
          freeNote.append(document.createTextNode(`${free.length} of the ${plan.length} actions cost nothing — they are letters, not engineering. Full costings in `),
            ref('the acquisitions', 'acquisition'), document.createTextNode('.'));
          gutter.append(gateNames, freeNote);

          const grid = $('div', 'marginal');
          const left = $('div', 'chartblock');
          left.append(list);
          grid.append(left, gutter);

          main.append(sect(9, 'Two of the twelve are gates, not tasks',
            [document.createTextNode('Twelve actions across the first quarter. The two in red are not work items — they are '),
             $('b', '', 'permission to spend'),
             document.createTextNode(', and everything after them is provisional until they clear.')],
            grid,
            'Fig. 9 — Week spans per action; red marks a gate. A chart, not an explainer: the ordering is the argument and there is nothing here for a reader to change.'));
        }

        /* ---------------------------------------------------- 10 · Repetition (Accumulator)
         *
         * Audit rows #4 and #4'. Absorbs the old §4 (budget rungs), which showed the same tier
         * shape scaled four ways and made the same argument this section makes properly: the
         * budget is a pool read on a schedule, not a collection target.
         *
         * Family is Accumulator — step forward and each pass multiplies the last. The two dials it
         * replaces let a reader wander to settings the research has no evidence for; the epoch
         * ladder is the finding, so the ladder is what the reader walks.
         */
        {
          const advised = data.mix_rules.max_epochs_advised.value;   // 4
          const hard = data.mix_rules.max_epochs_hard.value;         // 16
          const presets = data.milestones.presets;
          const naturalOf = (p) => p.mix.tiers.find((t) => t.name === 'indic-natural');
          const POOL = naturalOf(presets[2]).unique_tokens;          // the 15T rung's natural pool

          const LADDER = [1, 2, 4, 8, 16, 24];
          const STATES = [
            ...LADDER.map((e) => ({
              epochs: e,
              marg: `x${e} ${e === 1 ? 'pass' : 'passes'}`,
              lead: e === 1
                ? 'Read the natural Indic pool once and this is everything it contributes. It is not enough for the budget, and no amount of collecting closes the gap in the time available — so the question is not how much more text exists, it is '
                : e <= advised
                  ? `Read it ${e} times and the contribution multiplies. A token seen a ${e === 2 ? 'second' : 'fourth'} time is worth nearly as much as a fresh one, which means the pool is `
                  : e <= hard
                    ? `Past ${advised} passes the returns decay. The tokens still count and the run still improves, but each pass buys less than the one before, so this is `
                    : `Beyond ${hard} passes the evidence runs out entirely. Nothing here says it breaks — it says `,
              bold: e === 1 ? 'how many times the same text can be read'
                : e <= advised ? 'larger than its size suggests'
                : e <= hard ? 'a budget decision rather than a free one'
                : 'nobody has measured it',
              tail: e === 1 ? '.' : e <= advised ? '.' : e <= hard ? '.' : ', which is a different claim and a worse position to plan from.',
            })),
            { rungs: true, marg: 'What it buys',
              lead: 'Against the four budget rungs, the same pool read four times supplies the natural-Indic slice of each. The rung the project can actually build today is the first one, and the recommended one needs ',
              bold: 'no new collection at all', tail: ' — only the schedule.' },
          ];

          main.append(buildExplainer({
            n: 10, wide: true,
            title: 'A small pool read four times is a large pool',
            claim: [
              document.createTextNode('Only so much natural Indian-language text exists, so reaching a token budget means reading it more than once. The finding worth having is that the first few passes are nearly '),
              $('b', '', 'free'),
              document.createTextNode(' — and that they stop being free at a knee somebody measured. Scrolling steps the schedule; the pool never changes. Evidence in '),
              ref('the priors', 'priors'), document.createTextNode('.'),
            ],
            figNum: 'Fig. 10 — the schedule, not the pool',
            caption: 'Fig. 10 — Effective tokens from a fixed natural-Indic pool as passes accumulate. One mark per pass: accent while the evidence supports it, red past the hard ceiling of 16, where nothing has been measured. The pool is constant throughout — only the reading changes.',
            pill: '4 passes ~= free',
            rail: [
              document.createTextNode('The knee at '),
              renderNumber(data.mix_rules.max_epochs_advised),
              document.createTextNode(' and the ceiling at '),
              renderNumber(data.mix_rules.max_epochs_hard),
              document.createTextNode(' are '),
              $('b', '', 'estimated from published work'),
              document.createTextNode(', not measured on this corpus. They are the least certain load-bearing numbers on this page, and the whole Indic budget rests on them.'),
            ],
            states: STATES,
            refresh: (api) => {
              STATES.forEach((st, i) => {
                if (st.rungs) {
                  api.shard(i, presets.map((p) => `${p.id}: ${fmt(naturalOf(p).unique_tokens, 'count')} unique x${naturalOf(p).epochs}`).join('\n'));
                  api.inline(i, `→ every rung reads its pool ${naturalOf(presets[0]).epochs} times`, false);
                } else {
                  api.shard(i, `${fmt(POOL, 'count')} unique x ${st.epochs} = ${fmt(POOL * st.epochs, 'count')} seen`);
                  api.inline(i, `→ ${fmt(POOL * st.epochs, 'count')} effective${st.epochs > hard ? ' — past the ceiling, unevidenced' : ''}`, st.epochs > hard);
                }
              });
            },
            render: (i, api) => {
              const st = STATES[i];
              if (st.rungs) {
                const bars = $('div', 'tierbars');
                const maxSeen = Math.max(...presets.map((p) => naturalOf(p).seen_tokens));
                presets.forEach((p) => {
                  const n = naturalOf(p);
                  const row = $('div', 'tierrow');
                  const track = $('div', 'tiertrack');
                  const fill = $('div', `tierfill ${p.recommended ? 'natural' : 'dim'}`);
                  fill.style.width = `${(n.seen_tokens / maxSeen) * 100}%`;
                  track.append(fill);
                  const val = $('div', 'tierval');
                  val.append(renderNumber({ value: n.seen_tokens, unit: 'tokens', provenance: 'estimated', source: 'computed:milestones' }, { unit: false }));
                  row.append($('div', 'tiername', p.id), track, val);
                  bars.append(row);
                });
                api.extra.replaceChildren(bars);
                api.big({ value: naturalOf(presets[2]).seen_tokens, unit: 'tokens', provenance: 'estimated', source: 'computed:milestones' });
                api.bigHit(false);
                api.sub('natural Indic supplied at the recommended rung');
                api.verdict('NO NEW COLLECTION', false);
                api.note(`Each rung reads its own pool ${naturalOf(presets[0]).epochs} times. The difference between rungs is how much text was collected, not how hard it was read.`);
                api.strip(presets.map((p) => (p.recommended ? 'reg' : '')));
                return;
              }
              const effective = POOL * st.epochs;
              const past = st.epochs > hard;
              api.extra.replaceChildren();
              api.big({ value: effective, unit: 'tokens', provenance: 'estimated', source: 'computed: pool x epochs' });
              api.bigHit(past);
              api.sub(`from ${fmt(POOL, 'count')} unique, read ${st.epochs} ${st.epochs === 1 ? 'time' : 'times'}`);
              api.verdict(past ? 'UNEVIDENCED' : st.epochs <= advised ? 'NEARLY FREE' : 'DECAYING', past);
              api.note(past
                ? `Red marks passes beyond ${hard}, where no published work reaches. This is not a measured penalty — it is an absence of evidence, which is worse to plan against.`
                : st.epochs <= advised
                  ? `Multiplied ${st.epochs}x for the cost of re-reading. Collecting this much fresh Indic text is not something anyone can do in the schedule.`
                  : `Still ahead of ${advised} passes, but each additional read buys less. Past here the argument is about diminishing returns, not free capacity.`);
              api.strip(Array.from({ length: LADDER[LADDER.length - 1] }, (_, k) => {
                if (k >= st.epochs) return '';
                return k >= hard ? 'hit' : 'reg';
              }));
            },
          }));
        }

        /* ---------------------------------------------------- 11 · The Verdict */
        {
          const box = $('div');
          const line = (chip, cls, text) => {
            const v = $('div', 'verdictline');
            v.append($('span', `chip ${cls}`, chip), $('span', '', text));
            return v;
          };
          box.append(
            line('WIN', 'win', 'Indic breadth and India-context knowledge — nothing open covers 22 languages with this weighting.'),
            line('PARITY', 'parity', 'English reasoning and code — the corpus is the same public corpus everyone else uses.'),
            line('LOSE', 'lose', 'Anything gated behind licensed data nobody will sell you, and any claim that needs a benchmark that does not exist.'),
          );
          const scope = $('p');
          scope.style.cssText = 'font-size:13px;color:var(--muted);margin:16px 0 0;max-width:62ch';
          scope.append(document.createTextNode('The honest scope line: the single number this all rests on — how much deduplicated natural Indic text exists — has never been measured by anyone, and the fertility figures are still unrun. Both are in '),
            ref('the unknowns', 'risks'), document.createTextNode('. This is a plan with its uncertainty attached, not a result.'));
          /* PROSE (audit row #11). The claim needs no comparison a reader could perform, so
           * EXPLAINER_PROMPT §9 applies: write the sentence. The card goes; a hairline carries it. */
          const block = $('div', 'chartblock');
          block.append(box, scope);
          main.append(sect(11, 'Where this would win, and where it would not',
            [document.createTextNode('Three claims with their scope attached, because a verdict without one is marketing.')],
            block, null));
        }

        const counts = data.record_counts;
        document.getElementById('foot').replaceChildren(
          document.createTextNode(
            `Built from ${counts.catalog} datasets, ${counts.benchmarks} benchmarks and ${counts.legal} legal records. `
            + `Pipeline ${data.pipeline_version}${data.generated_at ? `, generated ${data.generated_at}` : ''}.`),
          $('div', 'disclaim', 'Licence and legal summaries here are a coursework reading of public material, not legal advice. Not affiliated with any organisation named — see NOTICE.'),
        );

        /* ---------------------------------------------------- endnotes + print
         *
         * A printed cross-reference is useless as a link, so each one is numbered in the text and
         * resolved here. And because widgets animate on scroll, printing without playing them
         * first would emit blank charts for every section the reader never reached.
         */
        const notes = $('section');
        notes.id = 'endnotes';
        notes.append($('h2', '', 'References'));
        const ol = document.createElement('ol');
        [...refNotes.entries()]
          .sort((a, b) => a[1] - b[1])
          .forEach(([anchor]) => ol.append($('li', '', `The reasoning · ${anchor}`)));
        notes.append(ol);
        main.append(notes);

        const forceEndStates = () => playAll.forEach((play) => { try { play(); } catch { /* a widget that cannot replay still prints its current state */ } });
        window.addEventListener('beforeprint', forceEndStates);
        // Safari and some PDF engines never fire beforeprint; the media query is the reliable hook.
        window.matchMedia('print').addEventListener?.('change', (e) => { if (e.matches) forceEndStates(); });
      }
    </script>
  </body>
</html>
