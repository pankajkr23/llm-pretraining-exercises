name: CI

on:
  # `push` without a branch filter alongside `pull_request` ran this job TWICE for every commit on
  # a PR branch -- same commit, same steps, same result, twice the wall-clock and twice the runner
  # minutes. Restricting push to `main` keeps the post-merge run and leaves branches to the PR
  # event, which is the one whose checks a PR actually reports.
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run obsolete. Cancelling it frees the runner
# immediately instead of finishing a report nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The default is six hours. Nothing here legitimately takes more than a few minutes, so a hang
    # should fail fast instead of holding a runner for an afternoon.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Sync workspace (all members + dev group)
        run: uv sync --all-packages

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -m "not integration"

      # The rendering tests need a real browser.
      #
      # This step used to run `playwright install --with-deps`, and the comment above it claimed
      # setup-uv's cache covered it. Both were wrong. setup-uv caches the Python environment, not
      # `~/.cache/ms-playwright` where browsers live, and `--with-deps` shells out to apt, which on
      # a GitHub runner spends twenty minutes negotiating Azure mirrors for libraries the
      # ubuntu-latest image already ships. One observed run sat at 20m and was still going.
      #
      # So: cache the browser by the resolved Playwright version, and skip apt. If a library really
      # is missing the browser fails to launch, and the fixtures turn that into a hard failure on
      # CI rather than a silent skip — see `test_mixture_page_render.py`.
      - name: Resolve the Playwright version (for the cache key)
        id: pw
        run: echo "version=$(uv run python -c 'import playwright; print(playwright.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install chromium (for the rendering tests)
        timeout-minutes: 6
        run: uv run playwright install chromium

      - name: Integration tests
        run: |
          uv run pytest -m integration || code=$?
          # exit 5 = "no tests collected" — fine until the first integration test lands
          if [ "${code:-0}" = "5" ]; then echo "no integration tests yet"; exit 0; fi
          exit "${code:-0}"

      # `find` rather than a glob: the previous pattern was web/js/*.js, which matched nothing —
      # exercise 01 inlines its JS and exercise 03 keeps shared modules in web/_shared/, so the
      # step silently checked zero files.
      - name: Web bundle syntax (node --check)
        run: |
          found=0
          while IFS= read -r f; do
            echo "checking $f"
            node --check "$f"
            found=$((found + 1))
          done < <(find src/exercises -path '*/web/*' -name '*.js' -type f | sort)
          echo "checked $found file(s)"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so pushes scan every commit; PRs scan the diff

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
