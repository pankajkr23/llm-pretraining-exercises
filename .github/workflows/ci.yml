name: CI

on:
  # `push` without a branch filter alongside `pull_request` ran this job TWICE for every commit on
  # a PR branch -- same commit, same steps, same result, twice the wall-clock and twice the runner
  # minutes. Restricting push to `main` keeps the post-merge run and leaves branches to the PR
  # event, which is the one whose checks a PR actually reports.
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run obsolete. Cancelling it frees the runner
# immediately instead of finishing a report nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The default is six hours. Nothing here legitimately takes more than a few minutes, so a hang
    # should fail fast instead of holding a runner for an afternoon.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, because `tools/queue_status.py` compares the progress log against the
          # pull requests actually merged and a shallow clone has none to compare against. It was
          # first written off as a local-only gate for that reason — which this repo's own rule
          # calls barely a gate. The cost was assumed rather than measured, and the measurement
          # says otherwise: the `security` job already fetches full history and scans EVERY commit
          # with gitleaks in 7 seconds, over 519 commits and a 33 MB `.git`.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Sync workspace (all members + dev group)
        run: uv sync --all-packages

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      # `--dist loadfile` is a CORRECTNESS requirement here, not a tuning knob. Several suites
      # write a JS harness beside the module under test — a fixed path, deleted in a `finally` —
      # because ES module imports resolve against the importing file's own directory. Plain
      # `-n auto` splits a file across workers, so one worker deletes the harness another is
      # running: 4 errors, every time. Keeping a file on one worker removes the collision.
      # No two test files share a harness path, so this is sufficient.
      - name: Unit tests
        run: uv run pytest -m "not integration" -n auto --dist loadfile

      # `find` rather than a glob: the previous pattern was web/js/*.js, which matched nothing —
      # exercise 01 inlines its JS and exercise 03 keeps shared modules in web/_shared/, so the
      # step silently checked zero files.
      #
      # AND IT MUST PARSE AS A MODULE. Plain `node --check <file>` parses with the SCRIPT goal,
      # which for a `.js` file means node wraps the source in the CommonJS function wrapper first —
      # so a stray `}` merely closes that wrapper early and the file passes. Every file this step
      # checks is an ES module. A real one slipped through exactly this way: `node --check` exited
      # 0 on a diagrams.js with an unbalanced brace, and the browser refused it with
      # "Unexpected token '}'". Feeding the file on stdin with --input-type=module parses with the
      # module goal, which passes valid modules and catches that.
      - name: Web bundle syntax (parsed as ES modules)
        run: |
          found=0
          while IFS= read -r f; do
            echo "checking $f"
            node --input-type=module --check < "$f"
            found=$((found + 1))
          done < <(find src/exercises -path '*/web/*' -name '*.js' -type f | sort)
          echo "checked $found file(s)"

  # Integration is ~227s of work and the fast job above is ~15s, so this is where the wall clock
  # lives. Two levels of parallelism, because one is not enough:
  #
  #   * ACROSS runners -- this matrix. `--dist loadfile` keeps a file on one worker (it must; see
  #     tests/test_parallel_safety.py), so the SLOWEST SINGLE FILE is a hard floor no number of
  #     workers can beat. Measured: 02's test_js_encoder.py alone is 55s. Sharding lets that file
  #     overlap with the other exercises instead of queueing behind them.
  #   * WITHIN a runner -- `-n auto`.
  #
  # Shards are balanced on measured cost, not on tidiness:
  #   02 = 116s   05 = 57s   04 = 34s   03 = 14s   01/06/root = ~1s
  integration:
    # **Named explicitly, or the check name carries the shard's paths.** With no `name:`, GitHub
    # builds a matrix job's check name from EVERY matrix value, so this one reported as
    # `integration (rest, src/exercises/01-introductions src/exercises/03-…)`. Adding an exercise
    # to a shard rewrites that string — and a required status check whose name changes simply stops
    # reporting, which blocks every pull request with no error that explains why. Exercises 09 and
    # 10 join the `rest` shard, so this was days from happening.
    name: integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One shard failing should not hide the others' results.
      fail-fast: false
      matrix:
        include:
          - name: tokenization
            paths: src/exercises/02-tokenization
          - name: mixtures
            paths: src/exercises/05-datamixtures-and-curriculum
          - name: rest
            paths: >-
              src/exercises/01-introductions
              src/exercises/03-data-collection-framework
              src/exercises/04-data-cleaning-dedup
              src/exercises/06-build-training-dataset
              src/exercises/07-model-embeddings-internals
              src/exercises/08-modern-attention-variants
              src/exercises/09-loss-functions-output-heads
              tests
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Sync workspace (all members + dev group)
        run: uv sync --all-packages

      # Recorded so a future slowdown can be told apart from a smaller runner. `-n auto` follows
      # the core count, and without this the two are indistinguishable in a log.
      - name: Record the runner's size
        run: |
          echo "cores: $(nproc)"
          uv run python -c "import os; print('pytest -n auto will use', os.cpu_count(), 'workers')"

      # `playwright.__version__` does not exist — the module has never exported one — so this step
      # raised `AttributeError`, printed nothing, and the cache key came out as
      # `playwright-Linux-` with an empty version. It therefore matched every previous run's empty
      # key, or none, and the browser download ran anyway. `importlib.metadata` reads the installed
      # distribution, which is what the key was always meant to name. A cache step that silently
      # never hits costs a browser download on every integration shard, three times per run.
      - name: Resolve the Playwright version (for the cache key)
        id: pw
        run: |
          v=$(uv run python -c "from importlib.metadata import version; print(version('playwright'))")
          test -n "$v" || { echo "could not resolve the playwright version" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install chromium (for the rendering tests)
        timeout-minutes: 6
        run: uv run playwright install chromium

      # Assembled ONCE per shard, before the parallel run. Two `site` fixtures fall back to running
      # `deploy/vercel/build.sh` when `public/` is missing, and that script begins with
      # `rm -rf public/` -- two workers would delete each other's site mid-test.
      - name: Assemble the site
        run: bash deploy/vercel/build.sh

      - name: Integration tests (${{ matrix.name }})
        run: |
          uv run pytest -m integration -n auto --dist loadfile ${{ matrix.paths }} || code=$?
          # exit 5 = "no tests collected" — a shard with no integration tests is fine
          if [ "${code:-0}" = "5" ]; then echo "no integration tests in this shard"; exit 0; fi
          exit "${code:-0}"

  # torch is an optional extra, so `uv sync --all-packages` leaves it out — and every module-level
  # `importorskip("torch")` then skips its ENTIRE file. That silently removed 46 of exercise 06's
  # tests and all 20 of its integration tests from CI, plus exercise 05's proxy run. It stayed
  # invisible because a file that collects nothing looks exactly like a file with nothing in it,
  # and the integration step below treats pytest's exit code 5 as success. Every gate was green
  # while the crash drill, the four-rank reduction and the gradient weighting ran nowhere.
  #
  # Affordable because pyproject.toml pins a CPU-only index for torch on Linux: 191.8 MB instead of
  # the 2.7 GB CUDA build, and 19 fewer packages in the lock. Nothing here trains on a GPU — the
  # graded run is CPU + gloo precisely so it behaves the same on a grader's machine.
  #
  # This job runs the gated files ONLY, so it duplicates nothing the shards already cover. It runs
  # parallel to the 164s tokenization shard, so it costs no wall clock.
  # `tests/test_ci_shards_cover_everything.py` fails if it ever stops covering them.
  train:
    name: torch-gated tests (CPU-only wheels)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Keyed on the lock, so the wheel is re-downloaded only when the pin actually moves.
      - name: Cache the torch download
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-train-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-train-${{ runner.os }}-

      - name: Sync workspace with the train extra
        run: uv sync --all-packages --extra train

      # If the index pin ever regresses, the CUDA wheel installs silently and this job goes from
      # ~90s to several minutes with nothing to point at. Fail on the fact instead.
      - name: Confirm the CPU build
        run: |
          version=$(uv run python -c "import torch; print(torch.__version__)")
          echo "torch: $version"
          case "$version" in
            *+cpu) echo "CPU-only wheel, as pinned" ;;
            *) echo "::error::expected a +cpu wheel; got '$version'. The pytorch-cpu index in"\
                    " pyproject.toml is not being applied, and this job just pulled the CUDA build."
               exit 1 ;;
          esac

      # The six files whose module-level importorskip("torch") makes them invisible without the
      # extra. Both markers: their unit AND integration tests are equally unreachable otherwise.
      # This list is hand-maintained, so tests/test_ci_shards_cover_everything.py fails when a new
      # torch-gated file is not added to it — which is how the OPUS scorer got here.
      - name: Torch-gated tests
        run: |
          uv run pytest -n auto --dist loadfile \
            src/exercises/05-datamixtures-and-curriculum/tests/test_mixture_proxy_run.py \
            src/exercises/06-build-training-dataset/tests/test_trainingdata_model.py \
            src/exercises/06-build-training-dataset/tests/test_trainingdata_train.py \
            src/exercises/06-build-training-dataset/tests/test_trainingdata_crash.py \
            src/exercises/06-build-training-dataset/tests/test_trainingdata_opus_score.py \
            src/exercises/07-model-embeddings-internals/tests/test_embeddings_heads.py \
            src/exercises/09-loss-functions-output-heads/tests/test_lossheads_equivalences.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so pushes scan every commit; PRs scan the diff

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned so a scan that passes locally means something. The same scanner runs in
          # `.pre-commit-config.yaml`; an unpinned CI could start flagging what the hook cleared.
          GITLEAKS_VERSION: 8.30.1
