name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Sync workspace (all members + dev group)
        run: uv sync --all-packages

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -m "not integration"

      # The rendering tests need a real browser. Cached by setup-uv's own cache key via the lock
      # file, so this is a download on dependency changes rather than on every run.
      - name: Install chromium (for the rendering tests)
        run: uv run playwright install --with-deps chromium

      - name: Integration tests
        run: |
          uv run pytest -m integration || code=$?
          # exit 5 = "no tests collected" — fine until the first integration test lands
          if [ "${code:-0}" = "5" ]; then echo "no integration tests yet"; exit 0; fi
          exit "${code:-0}"

      # `find` rather than a glob: the previous pattern was web/js/*.js, which matched nothing —
      # exercise 01 inlines its JS and exercise 03 keeps shared modules in web/_shared/, so the
      # step silently checked zero files.
      - name: Web bundle syntax (node --check)
        run: |
          found=0
          while IFS= read -r f; do
            echo "checking $f"
            node --check "$f"
            found=$((found + 1))
          done < <(find src/exercises -path '*/web/*' -name '*.js' -type f | sort)
          echo "checked $found file(s)"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so pushes scan every commit; PRs scan the diff

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
