# Local gates, run before a commit exists.
#
# These are a fast feedback loop, NOT the enforcement point. A hook can be skipped with
# `--no-verify` and is not installed on a fresh clone, so CI remains the thing that decides.
# What this buys is finding a problem in two seconds instead of two minutes, on your machine
# instead of in a pull request — which is exactly what was missing when a test placeholder named
# `plan_key_digest` failed CI's secret scan on PR #67.
#
# Install once per clone:
#     uv sync --all-packages && uv run pre-commit install
#
# Run over everything (not just staged files):
#     uv run pre-commit run --all-files

# The local-only files are destroyed by CHECKOUT and MERGE, not by committing — so a config that
# only declares `pre-commit` protects them at the one moment they were never at risk. Declaring the
# hook types here means `pre-commit install` wires all four, and the snapshot happens on the
# operation that does the damage rather than whenever somebody remembers.
#
# `commit-msg` is here because the scope guard runs at that stage, and a stage missing from this
# list is a hook `pre-commit install` never wires — so it would exist, pass its own tests, and
# never once run on a real commit. `tests/test_precommit_config.py` asserts the two agree.
default_install_hook_types: [pre-commit, commit-msg, post-checkout, post-merge, post-rewrite]

repos:
  # --- secrets ---------------------------------------------------------------------------------
  # A local hook rather than the upstream one on purpose: the upstream hook builds gitleaks from
  # source with Go, and this way the binary that runs here is the same one available to run
  # `gitleaks detect` by hand when a finding needs investigating. It FAILS rather than skips when
  # gitleaks is absent — a secret scan that quietly does not run is worse than none, because it
  # reads as coverage.
  - repo: local
    hooks:
      - id: gitleaks
        name: scan staged changes for secrets
        entry: bash -c 'command -v gitleaks >/dev/null || { echo "gitleaks is not installed. brew install gitleaks — or https://github.com/gitleaks/gitleaks/releases"; exit 1; }; exec gitleaks protect --staged --redact --verbose'
        language: system
        pass_filenames: false

  # --- lint and format -------------------------------------------------------------------------
  # Through `uv run`, so this is the ruff pinned in pyproject.toml and not a second copy that can
  # drift from the one CI uses.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  # --- hygiene ---------------------------------------------------------------------------------
  # Every hook here is a CHECK. None of them rewrites a file.
  #
  # `end-of-file-fixer` and `trailing-whitespace` were in the first draft of this config and are
  # deliberately absent now: run once over the repo, they rewrote `02-tokenization/web/tokenizer.json`
  # — the frozen tokenizer whose bytes are hashed and whose hash every shard manifest in exercise 06
  # pins. A cosmetic newline would have voided that hash and invalidated every manifest, and the diff
  # would have looked like tidying. They also touched the corpus text files, which are data, not
  # source. Nothing in this repo may silently rewrite content; ruff already formats the Python, which
  # is the only thing here that wants formatting.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=2048] # the tracked submission bundle's cap; anything larger wants a decision
      - id: check-yaml
      - id: check-toml

  # --- the files git cannot restore -------------------------------------------------------------
  # `notebooks/`, the notebook builders, every REQUIREMENTS.md, the whole course corpus and the course's
  # reference solution are gitignored, so git has never seen them and cannot bring them back. They
  # have already been destroyed twice by ordinary checkouts.
  #
  # These run on checkout, merge and rewrite — the operations that do the damage — and NOT on
  # commit, where they would cost two seconds for nothing. `always_run` with `pass_filenames: false`
  # because the question is about the working tree, not about which files are staged.
  - repo: local
    hooks:
      - id: backup-local-only
        name: snapshot the files git cannot restore
        entry: 'uv run python tools/backup_local_only.py --message "auto post-checkout"'
        language: system
        stages: [post-checkout, post-merge, post-rewrite]
        always_run: true
        pass_filenames: false

      # The confidentiality gate, on COMMIT rather than on checkout: the damage here is something
      # entering a commit, not something leaving the working tree.
      #
      # BOTH halves run. The naming half needs nothing but the repo, so it also runs in CI. The
      # quoting half compares tracked prose against the reference material and therefore only has
      # anything to say on a machine that holds it — it skips elsewhere, CI included, and says so.
      # That is the honest division: CI can prove no filename leaked, and only this hook can prove
      # no sentence did.
      #
      # It ran with the quoting half disabled for exactly as long as that check was red. It is
      # green now, so it gates.
      - id: no-confidential-leaks
        name: no tracked file names or quotes a confidential source
        entry: uv run pytest tests/test_no_confidential_leaks.py -q
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

      # The vocabulary gate. Separate from the hook above because it guards a different thing and
      # runs in a different place: that one needs the material to compare against and is therefore
      # local-only, while this one needs nothing but the repo and so also runs in CI. A word can
      # come back without any filename or sentence coming back with it.
      - id: no-forbidden-vocabulary
        name: no tracked file uses the forbidden vocabulary
        entry: uv run pytest tests/test_forbidden_vocabulary.py -q
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

      # Breadth has to be a decision somebody recorded, not something that happened.
      #
      # `commit-msg` rather than `pre-commit`, because it is the only stage that sees BOTH the
      # staged diff and the message — and the message is where the escape hatch lives. A hard cap
      # with no escape would fight the property it protects: a hook, the module it imports and its
      # test do not work apart, so splitting them puts `git bisect` on a tree that fails for an
      # unrelated reason.
      #
      # `pass_filenames: true` is the default here and is load-bearing: pre-commit hands a
      # commit-msg hook the path of the message file, which is the argument this script takes.
      - id: commit-scope
        name: one commit, one decision
        entry: uv run python tools/check_commit_scope.py
        language: system
        stages: [commit-msg]
        always_run: true

      - id: local-only-tripwire
        name: check nothing local-only went missing
        entry: uv run pytest tests/test_local_only_files_present.py -q
        language: system
        stages: [post-checkout, post-merge, post-rewrite]
        always_run: true
        pass_filenames: false
