# What an agent may never write in this repo, whatever its unit scope says.
#
# Tracked on purpose. The `.claude/` tree is gitignored in its entirety, so a policy living there
# would be invisible to review, absent from a clone, and impossible to test in CI — which is the
# same "reads as coverage" shape this repo keeps finding. The machinery is tracked; only the thin
# wiring that points Claude Code at it is local.
#
# Every entry names the incident it exists for. A rule with no incident behind it is a rule nobody
# can judge, and it is the first one somebody deletes when it gets in the way.

[scope]
# Paths a unit may write are listed in `.claude/UNIT.md`. When that file is absent the guard is
# INERT for scope — it does not block everything, because a guard that fires constantly gets
# uninstalled. The other sections below apply regardless.
unit_file = ".claude/UNIT.md"

[measured_data]
# **Editing any of these changes a RESULT, not a document.**
#
# A word-substitution sweep rewrote BPE tokens inside the frozen tokenizer, whose bytes are hashed
# and whose hash every shard manifest in exercise 06 pins. It also rewrote a line of the tokenizer's
# training corpus. Neither was caught by review; the first was caught by a build refusing an
# out-of-vocabulary token, and the second by reading the diff.
patterns = [
  "src/exercises/02-tokenization/web/tokenizer.json",
  "src/exercises/02-tokenization/web/data.json",
  "src/exercises/*/corpus/**",
  "src/exercises/*/results/*.json",
  "uv.lock",
  "**/package-lock.json",
  "docs/standards-history/**",
]
why = "measured input or a frozen artefact; editing it changes a result rather than a document"

[guards]
# **Not writable unless `.claude/UNIT.md` names the file explicitly.**
#
# On 2026-09-02 an agent auditing this repo injected `return []` into two data-handling invariants
# to watch their guards go red, restored one of the two, and a `git add -A` swept the rest into a
# commit. Both returned "no findings" for every input across four commits — indistinguishable from
# a clean run.
#
# ImpossibleBench measured the general case: GPT-5 exploited test cases 76% of the time, dropping to
# near zero when test access was made read-only. This is that, applied to the files that matter most.
patterns = [
  "tests/test_forbidden_vocabulary.py",
  "tests/test_no_confidential_leaks.py",
  "tests/test_skip_ledger.py",
  "tests/_skips.py",
  "tests/test_local_only_files_present.py",
  "tools/backup_local_only.py",
  "tools/check_commit_scope.py",
  "tools/agent_guard.py",
  "tools/agent_fleet/guard_rules.toml",
  "src/exercises/03-data-collection-framework/tests/test_invariants.py",
  "src/exercises/05-datamixtures-and-curriculum/src/mixture/checks.py",
  "conftest.py",
]
why = "a guard the agent could weaken to make its own work pass; name it in UNIT.md to edit it"

[irreplaceable]
# **The files git cannot restore — and until 2026-09-05 this policy protected the TOOLS that guard
# them and not one byte of the files themselves.**
#
# `tools/backup_local_only.py` and `tests/test_local_only_files_present.py` are in [guards] below,
# so an agent could not weaken the backup tool or the tripwire. It could still overwrite what they
# exist to protect. `AGENTS.md` calls these the only files in the repository with no second copy:
# they are gitignored, so `git checkout` cannot bring them back, and a bad overwrite is
# indistinguishable from an intended one until someone opens the file.
#
# It has happened twice. A routine `git checkout main && git pull` destroyed all five notebook
# builders; an ordinary branch switch destroyed four requirement documents. Neither was anybody
# deciding to delete anything.
#
# The backup store is the recovery path, and it is a high-water mark rather than a mirror — it
# never removes, so it cannot undo an overwrite that was itself backed up. Refusing the write is
# the only point at which the content still exists.
patterns = [
  "notebooks/**",
  "src/exercises/*/tools/build_notebook.py",
  "src/exercises/*/REQUIREMENTS.md",
  "docs/REQUIREMENTS.md",
  "src/exercises/*/src/solution/**",
]
why = "gitignored and unrecoverable: git cannot restore it and the append-only store cannot undo an overwrite"

[working_notes]
# **Unrecoverable like the section above, but meant to be rewritten — so this one CAN be opened.**
#
# `TODO.md` and `HANDOFF.md` were in `[irreplaceable]`, which is a `NO_ESCAPE_HATCH` section. The
# reasoning there is right for a notebook: a unit that regenerates one does it by running its
# builder, which writes through a path this guard never inspects, so naming it would buy nothing.
#
# It is wrong for a working note. Rewriting these IS their function — a to-do list nobody can update
# is not a to-do list — and freezing them meant the guard refused a rewrite that had been explicitly
# asked for, with no way to name past it.
#
# They still need protecting, and more than most files here: neither is in git, and `HANDOFF.md` is
# not in `backup_local_only.py::PATTERNS` either, so it exists in exactly one place on disk. An
# accidental clobber takes the only copy. Hence: refused by default, allowed when a unit names the
# file — the same bar as editing a guard.
patterns = [
  "TODO.md",
  "HANDOFF.md",
]
why = "a working note with no second copy: name it in UNIT.md to rewrite it, so the clobber is deliberate"

[standards]
# Changing the rules mid-unit is how a unit passes by lowering the bar. Allowed only when the unit
# is explicitly about the standard, which `UNIT.md` has to say.
patterns = [
  "AGENTS.md",
  "CLAUDE.md",
  "docs/DESIGN.md",
  "docs/AGENT_FLEET.md",
  ".pre-commit-config.yaml",
  ".github/workflows/*.yml",
  "vercel.json",
  ".gitleaksignore",
]
why = "a standard file; changing it mid-unit lowers the bar the unit is being judged against"

[destructive_git]
# **A git command that destroys work, refused by its FLAG rather than by its name.**
#
# Every other section here names paths. This one cannot: the commands below take no path argument
# in their dangerous form, so `bash_write_targets` sees nothing to check and the call sails past a
# guard that is working perfectly. `git clean -fdx` in a repository whose notebooks, builders and
# requirement documents are all gitignored deletes every one of them and names not one of them.
#
# **The flag is the whole distinction, and stating the command without it teaches the wrong
# lesson.** Plain `git clean -fd` is safe here precisely because these files are *ignored* rather
# than untracked; plain `git stash -u` is safe for the same reason. `AGENTS.md` said the opposite
# about stash for months.
#
# Checked per SEGMENT, so `git checkout main && git clean -xfd` is refused on its second half —
# bundling is how a destructive command travels next to an innocent one, and it is what the
# incident behind this section actually looked like.
#
# **What it does not catch, said plainly.** `git checkout <tag>` overwrites live gitignored files
# with stale tagged copies and is listed in `AGENTS.md` as a live hazard, but a tag name is
# indistinguishable from a branch name without asking git, and refusing every checkout would get
# this guard uninstalled by lunchtime. A shell is also Turing-complete: `g=clean; git $g -x` builds
# the flag at runtime and no static reader sees it. This raises the cost of the casual case, which
# is the one that has actually cost this repository work — twice.

[[destructive_git.rules]]
subcommand = "clean"
flags = ["-x", "-X"]
why = """`-x` and `-X` delete IGNORED files, which here is every notebook, every notebook builder
and every REQUIREMENTS.md — the files with no second copy anywhere. Plain `git clean -fd` does not
touch them and is not blocked."""

[[destructive_git.rules]]
subcommand = "stash"
flags = ["-a", "--all"]
why = """`--all` stashes ignored files, which is the same set `clean -x` deletes. Plain
`git stash -u` is safe here and is not blocked."""

[[destructive_git.rules]]
subcommand = "reset"
flags = ["--hard"]
why = """`--hard` discards every uncommitted change with no reflog entry for the working tree.
Committing first costs one command and makes the same state recoverable."""

[[destructive_git.rules]]
subcommand = "push"
flags = ["-f", "--force", "--force-with-lease"]
why = """Force-pushing rewrites published history. `main` is protected server-side by a ruleset, so
this would only ever land on a branch someone else may have pulled — and the repository's standing
instruction is that history is never rewritten."""

[[destructive_git.rules]]
subcommand = "tag"
flags = ["-d", "--delete"]
why = """A tag is data. Eleven of them carry gitignored files, `snapshot_standards.py` measures
against the newest one, and deleting one silently breaks the standards archive's own guard."""

[[destructive_git.rules]]
subcommand = "branch"
flags = ["-D"]
why = """`-D` deletes a branch whose work is not merged, which is the only case the flag exists for.
`-d` refuses that on its own and is not blocked."""

[halt]
# One `touch` stops the fleet. Checked before anything else, so it stops a run already in flight.
file = "AGENT_STOP"
